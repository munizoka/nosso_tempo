<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masmorra da Bruxinha</title>
    <link rel="stylesheet" href="pet.css">
</head>
<body ontouchstart="">

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        
        <!-- BOTÃO DE VOLTAR NA TELA DE LOGIN -->
        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; background: rgba(255, 255, 255, 0.25); border-radius: 50%; color: white; text-decoration: none; font-size: 22px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.5); backdrop-filter: blur(5px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 9999;">←</a>

        <div class="login-box">
            <h2>🔮 O Cofre da Masmorra</h2>
            <p>Identifique-se para ver sua Bruxinha</p>
            <input type="email" id="email-input" placeholder="Seu e-mail mágico">
            <input type="password" id="password-input" placeholder="Sua senha">
            <button id="login-btn">Entrar</button>
            <p id="login-error" style="color: red; display: none;">Email ou senha incorretos!</p>
        </div>
    </div>

    <!-- TELA DE NOME -->
    <div id="name-screen" style="display: none;">
        <div class="name-modal">
            <img src="16.png" alt="Sua Bruxinha" style="width: 150px; margin-bottom: 15px;">
            <h2>Qual será o nome da sua Elphaba?</h2>
            <input type="text" id="pet-name-input" placeholder="Digite o nome aqui." maxlength="15">
            <button id="btn-save-name">Começar Aventura</button>
        </div>
    </div>

    <!-- TELA DO JOGO (MASMORRA) -->
    <div id="game-screen" style="display: none;">
        
        <!-- Cabeçalho 100% blindado contra falhas de Cache -->
        <div class="hud-top" style="position: absolute; top: 40px; width: 100%; padding: 15px; z-index: 10; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box;">
            
            <div style="display: flex; align-items: center;">
                <!-- BOTÃO DE VOLTAR PARA A LINHA DO TEMPO -->
                <a href="index.html" style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; background: rgba(255, 255, 255, 0.25); border-radius: 50%; color: white; text-decoration: none; font-size: 22px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.5); backdrop-filter: blur(5px); margin-right: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">←</a>
                
                <div class="pet-name" style="font-size: 20px; font-weight: bold; color: white;">
                    <span id="pet-name-display">Elfie</span>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="pet-age" style="color: white; font-weight: 500;">Idade: <span id="age-display">0</span> dias</div>
                <button id="logout-btn" style="padding: 8px 15px; background-color: #f44336; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;">Sair</button>
            </div>
            
        </div>

        <div id="window-view" class="day-time"></div>

        <!-- Masmorra -->
        <div class="dungeon-room">
            <img id="bruxa-img" src="16.png" alt="Bruxinha" class="breathe-anim">
            <div id="bathroom-curtain"></div>
        </div>

        <!-- BARRAS UNIFICADAS COM PERCENTAGEM -->
        <div class="hud-bottom">
            <div class="bar-container" id="btn-food">
                <div id="bar-fome" class="fill green"></div>
                <span class="btn-emoji">🍖</span>
                <span class="btn-percent" id="perc-fome">100%</span>
            </div>
            <div class="bar-container" id="btn-bath">
                <div id="bar-banheiro" class="fill blue"></div>
                <span class="btn-emoji">🚽</span>
                <span class="btn-percent" id="perc-banheiro">100%</span>
            </div>

            <div class="bar-container" id="btn-sleep">
                <div id="bar-energia" class="fill yellow"></div>
                <span class="btn-emoji">⚡</span>
                <span class="btn-percent" id="perc-energia">100%</span>
            </div>
            <div class="bar-container" id="btn-fun">
                <div id="bar-alegria" class="fill red"></div>
                <span class="btn-emoji">😃</span>
                <span class="btn-percent" id="perc-alegria">100%</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="pet.js"></script>
</body>
</html>
