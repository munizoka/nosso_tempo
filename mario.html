<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Força a tela cheia e impede zoom no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Super Gabriel Bros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #5c94fc; touch-action: none; font-family: 'Inter', sans-serif; }
        
        /* O Canvas do Jogo Pixelado */
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        /* Estilo do D-Pad Direcional (Esquerda) */
        .dpad-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            color: white;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            transition: all 0.05s linear;
        }
        .dpad-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0);
            background: rgba(255, 255, 255, 0.45);
        }

        /* Estilo do Botão A (Direita) */
        .action-btn {
            width: 80px;
            height: 80px;
            background: #f43f5e;
            border: 4px solid #fda4af;
            border-radius: 50%;
            color: white;
            font-size: 34px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 8px 0 #be123c, 0 15px 20px rgba(0,0,0,0.4);
            transition: all 0.05s linear;
        }
        .action-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #be123c, 0 5px 10px rgba(0,0,0,0.4);
            background: #e11d48;
        }
    </style>
</head>
<body>

    <!-- Aviso para girar a tela -->
    <div id="orientation-warning" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center text-white md:hidden portrait:flex landscape:hidden">
        <span class="text-6xl mb-4 animate-bounce">📱🔄</span>
        <h2 class="text-xl font-bold text-center px-4">Vire o celular deitado para jogar!</h2>
    </div>

    <!-- Interface Superior (Voltar e Recomeçar) -->
    <div class="absolute top-4 left-4 right-4 z-50 flex justify-between pointer-events-none">
        <a href="index.html" class="w-12 h-12 bg-black/40 border border-white/30 rounded-full flex items-center justify-center text-white font-bold backdrop-blur hover:bg-black/60 transition-all pointer-events-auto shadow-lg text-xl">←</a>
        
        <button onclick="reiniciarFase()" class="px-5 py-2 bg-black/40 border border-white/30 rounded-full flex items-center justify-center text-white font-bold backdrop-blur hover:bg-black/60 transition-all pointer-events-auto shadow-lg active:scale-95">
            🔄 Recomeçar
        </button>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- Controles Touch (Joysticks) Ocultos no PC, visíveis no Mobile -->
    <div class="fixed inset-0 pointer-events-none z-40 flex justify-between items-end pb-8 px-8 landscape:flex portrait:hidden sm:flex">
        
        <!-- D-PAD (Lado Esquerdo) -->
        <div class="flex flex-col items-center gap-1 pointer-events-auto">
            <!-- Botão Cima -->
            <button id="btn-up" class="dpad-btn">▲</button>
            
            <div class="flex gap-1">
                <!-- Botão Esquerda -->
                <button id="btn-left" class="dpad-btn">◀</button>
                <!-- Centro Vazio do D-Pad -->
                <div class="w-[60px] h-[60px] bg-white/5 rounded-xl border border-white/10"></div>
                <!-- Botão Direita -->
                <button id="btn-right" class="dpad-btn">▶</button>
            </div>
            
            <!-- Botão Baixo (Agachar) -->
            <button id="btn-down" class="dpad-btn">▼</button>
        </div>

        <!-- Botão A (Lado Direito) -->
        <div class="pointer-events-auto pb-4 pr-4">
            <button id="btn-jump" class="action-btn">A</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        const GAME_WIDTH = 600;
        const GAME_HEIGHT = 350;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        const keys = { left: false, right: false, up: false, down: false };

        // O HERÓI (GABRIEL) - Pulo Buffado para não prender!
        const player = {
            x: 50, y: 200, w: 24, h: 32,
            vx: 0, vy: 0,
            speed: 3.8, jumpPower: -11.5, gravity: 0.5,
            grounded: false, isCrouching: false,
            color: '#3b82f6'
        };

        const princess = {
            x: 2800, y: 288, w: 24, h: 32,
            color: '#ec4899'
        };
        const castle = { x: 2850, y: 200, w: 100, h: 120, color: '#94a3b8' };

        // INIMIGOS
        let enemies = [
            { x: 400, y: 288, w: 24, h: 24, vx: -1, type: 'goomba', alive: true, color: '#b45309' },
            { x: 900, y: 288, w: 24, h: 24, vx: -1, type: 'goomba', alive: true, color: '#b45309' },
            { x: 1400, y: 288, w: 24, h: 24, vx: -1.2, type: 'koopa', alive: true, color: '#15803d' },
            { x: 1450, y: 288, w: 24, h: 24, vx: -1.2, type: 'koopa', alive: true, color: '#15803d' }
        ];

        let cameraX = 0;
        let gameWin = false;

        // O CENÁRIO (Canos encurtados e espaçados para não haver softlock)
        const blocks = [
            // CHÃO PRINCIPAL
            { x: 0, y: 320, w: 1100, h: 100, type: 'ground', color: '#854d21' },
            { x: 1180, y: 320, w: 300, h: 100, type: 'ground', color: '#854d21' },
            { x: 1550, y: 320, w: 1500, h: 100, type: 'ground', color: '#854d21' },

            // CANOS VERDES (Altura máxima y=230 para ser fácil de pular)
            { x: 450, y: 280, w: 50, h: 40, type: 'pipe', color: '#22c55e' },
            { x: 650, y: 250, w: 50, h: 70, type: 'pipe', color: '#22c55e' },
            { x: 850, y: 230, w: 50, h: 90, type: 'pipe', color: '#22c55e' },
            { x: 1050, y: 230, w: 50, h: 90, type: 'pipe', color: '#22c55e' },

            // BLOCOS MISTERIOSOS E TIJOLOS
            { x: 250, y: 210, w: 24, h: 24, type: 'surprise', color: '#eab308' },
            
            { x: 350, y: 210, w: 24, h: 24, type: 'brick', color: '#b45309' },
            { x: 374, y: 210, w: 24, h: 24, type: 'surprise', color: '#eab308' },
            { x: 398, y: 210, w: 24, h: 24, type: 'brick', color: '#b45309' },
            { x: 422, y: 210, w: 24, h: 24, type: 'surprise', color: '#eab308' },
            { x: 446, y: 210, w: 24, h: 24, type: 'brick', color: '#b45309' },
            { x: 398, y: 100, w: 24, h: 24, type: 'surprise', color: '#eab308' },

            // ESCADINHA
            { x: 2400, y: 296, w: 24, h: 24, type: 'block', color: '#f87171' },
            { x: 2424, y: 272, w: 24, h: 48, type: 'block', color: '#f87171' },
            { x: 2448, y: 248, w: 24, h: 72, type: 'block', color: '#f87171' },
            { x: 2472, y: 224, w: 24, h: 96, type: 'block', color: '#f87171' },
        ];

        // Mapeamento de Teclado
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
        });

        // Mapeamento de Touch
        function bindTouch(id, keyStr) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyStr] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyStr] = false; });
        }
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-down', 'down');
        bindTouch('btn-up', 'up');    // Opcional no D-pad para pular
        bindTouch('btn-jump', 'up');  // Botão A principal para pular

        function isColliding(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        // Sistema de Reiniciar
        function reiniciarFase() {
            player.x = 50; 
            player.y = 100;
            player.vx = 0; 
            player.vy = 0;
            cameraX = 0;
            gameWin = false;
            // Revive inimigos
            enemies.forEach(e => { e.alive = true; });
        }

        function update() {
            if(gameWin) return;

            // Movimento Horizontal
            if (keys.left && !keys.down) player.vx = -player.speed;
            else if (keys.right && !keys.down) player.vx = player.speed;
            else player.vx = 0;

            // Agachar
            if (keys.down && player.grounded) {
                if(!player.isCrouching) {
                    player.isCrouching = true;
                    player.h = 16; 
                    player.y += 16;
                }
            } else if (player.isCrouching) {
                player.isCrouching = false;
                player.y -= 16;
                player.h = 32;
            }

            // Pulo
            if (keys.up && player.grounded && !keys.down) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            // Aplicar Gravidade
            player.vy += player.gravity;

            // --- RESOLUÇÃO DE COLISÕES SEGURA ---
            player.grounded = false;

            // Mover em X primeiro e resolver
            player.x += player.vx;
            if (player.x < cameraX) player.x = cameraX; 

            for (let b of blocks) {
                if (isColliding(player, b)) {
                    if (player.vx > 0) player.x = b.x - player.w; // Parede Direita
                    else if (player.vx < 0) player.x = b.x + b.w; // Parede Esquerda
                    player.vx = 0;
                }
            }

            // Mover em Y e resolver
            player.y += player.vy;
            for (let b of blocks) {
                if (isColliding(player, b)) {
                    if (player.vy > 0) { // Caiu no chão
                        player.y = b.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) { // Bateu a cabeça
                        player.y = b.y + b.h;
                        player.vy = 0;
                    }
                }
            }

            // Buraco da morte
            if (player.y > GAME_HEIGHT + 100) {
                reiniciarFase();
            }

            // Lógica dos Inimigos
            for (let enemy of enemies) {
                if (!enemy.alive) continue;
                
                enemy.y += 3; // Gravidade do inimigo
                for (let b of blocks) {
                    if (isColliding(enemy, b)) {
                        enemy.y = b.y - enemy.h;
                        break;
                    }
                }

                enemy.x += enemy.vx;
                for (let b of blocks) {
                    if (b.type !== 'ground' && isColliding(enemy, b)) {
                        if (enemy.vx < 0) { enemy.x = b.x + b.w; enemy.vx *= -1; }
                        else { enemy.x = b.x - enemy.w; enemy.vx *= -1; }
                    }
                }

                if (isColliding(player, enemy)) {
                    if (player.vy > 0 && player.y + player.h < enemy.y + 15) {
                        // Pisou na cabeça
                        enemy.alive = false;
                        player.vy = player.jumpPower * 0.7; // Pulo extra (quique)
                    } else {
                        // Sofreu dano
                        reiniciarFase();
                    }
                }
            }

            // Vitória
            if (isColliding(player, princess)) {
                gameWin = true;
            }

            // Câmera segue
            if (player.x > cameraX + GAME_WIDTH / 2.5) {
                cameraX = player.x - GAME_WIDTH / 2.5;
            }
        }

        function draw() {
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.save();
            ctx.translate(-cameraX, 0); 

            for (let b of blocks) {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                
                if(b.type === 'ground') {
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(b.x, b.y, b.w, 8);
                }
                if(b.type === 'surprise') {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px Inter';
                    ctx.textAlign = 'center';
                    ctx.fillText('?', b.x + 12, b.y + 18);
                }
            }

            ctx.fillStyle = castle.color;
            ctx.fillRect(castle.x, castle.y, castle.w, castle.h);
            ctx.fillStyle = princess.color;
            ctx.fillRect(princess.x, princess.y, princess.w, princess.h);
            
            for (let enemy of enemies) {
                if(enemy.alive) {
                    ctx.fillStyle = enemy.color;
                    ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                }
            }

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);

            if(gameWin) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(cameraX, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 30px Inter';
                ctx.textAlign = 'center';
                ctx.fillText("VOCÊ RESGATOU A VITÓRIA! ❤️", cameraX + GAME_WIDTH/2, GAME_HEIGHT/2 - 20);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
