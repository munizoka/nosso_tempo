<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Força a tela cheia e impede zoom no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Super Gabriel Bros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #5c94fc; touch-action: none; font-family: 'Press Start 2P', cursive; }
        
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated; /* Mantém o aspeto retro sem borrar */
        }

        /* D-Pad Estilo Consola Clássica */
        .dpad-container {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 4px;
        }
        .dpad-btn {
            background: #cbd5e1;
            border: 4px solid #475569;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 28px;
            color: #334155;
            box-shadow: 0 6px 0 #334155;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
        }
        .dpad-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #334155;
            background: #94a3b8;
        }
        
        #btn-up { grid-column: 2; grid-row: 1; border-radius: 12px 12px 4px 4px; }
        #btn-left { grid-column: 1; grid-row: 2; border-radius: 12px 4px 4px 12px; }
        #btn-right { grid-column: 3; grid-row: 2; border-radius: 4px 12px 12px 4px; }
        #btn-down { grid-column: 2; grid-row: 3; border-radius: 4px 4px 12px 12px; }
        .dpad-center { grid-column: 2; grid-row: 2; background: #cbd5e1; border: none; }

        /* Botão A (Pular) */
        .action-btn {
            width: 90px;
            height: 90px;
            background: #ef4444;
            border: 6px solid #f87171;
            border-radius: 50%;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 8px 0 #991b1b, 0 15px 25px rgba(0,0,0,0.5);
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
        }
        .action-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #991b1b, 0 5px 10px rgba(0,0,0,0.5);
            background: #dc2626;
        }

        /* Top Bar UI */
        .ui-text { text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; color: white; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Aviso para girar a tela -->
    <div id="orientation-warning" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center text-white md:hidden portrait:flex landscape:hidden">
        <span class="text-6xl mb-4 animate-bounce">📱🔄</span>
        <h2 class="text-sm text-center px-4 leading-relaxed font-sans">Gire o celular na horizontal<br>para jogar!</h2>
    </div>

    <!-- UI Superior -->
    <div class="absolute top-4 left-4 right-4 z-50 flex justify-between items-start pointer-events-none">
        <a href="index.html" class="w-12 h-12 bg-zinc-800/80 border-2 border-white rounded-full flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg text-2xl active:scale-90 transition-transform">←</a>
        
        <div class="flex gap-6 ui-text items-center mt-2 hidden sm:flex">
            <span>HP:8900</span>
            <span>🍄 x10</span>
            <span>⏱ 00:03:18</span>
        </div>

        <button onclick="reiniciarFase()" class="px-4 py-3 bg-zinc-800/80 border-2 border-white rounded-xl flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg active:scale-95 transition-transform text-sm uppercase">
            🔄 Recomeçar
        </button>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- Controles Mobile (Também funcionam com rato no PC) -->
    <div class="fixed inset-0 pointer-events-none z-40 flex justify-between items-end pb-8 px-10 landscape:flex portrait:hidden sm:flex">
        
        <!-- D-PAD Esquerdo -->
        <div class="dpad-container pointer-events-auto opacity-80 hover:opacity-100 transition-opacity">
            <div class="dpad-center"></div>
            <button id="btn-up" class="dpad-btn">▲</button>
            <button id="btn-left" class="dpad-btn">◀</button>
            <button id="btn-right" class="dpad-btn">▶</button>
            <button id="btn-down" class="dpad-btn">▼</button>
        </div>

        <!-- Botão A Direito -->
        <div class="pointer-events-auto pb-4 opacity-90 hover:opacity-100 transition-opacity">
            <button id="btn-jump" class="action-btn">A</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 450;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // ==========================================
        // SISTEMA DE IMAGENS E CHROMA KEY (FUNDO VERDE)
        // ==========================================
        const assets = {
            hero: new Image(),
            princess: new Image(),
            enemies: new Image(),
            castle: new Image(),
            surprise: new Image(),
            pipe: new Image(),
            brick: new Image(),
            ground: new Image()
        };

        let assetsLoaded = 0;
        const totalAssets = 8;
        let processedAssets = {};

        // Carrega as imagens
        assets.hero.src = '35.png';
        assets.princess.src = '36.png';
        assets.enemies.src = '37.jpg'; 
        assets.castle.src = '38.png';
        assets.surprise.src = '39.png';
        assets.pipe.src = '40.png';
        assets.brick.src = '41.png';
        assets.ground.src = '42.png';

        // Filtro para apagar o fundo verde limão da IA
        function removeGreenScreen(img) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(img, 0, 0);
            
            try {
                const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    if (g > 150 && r < 100 && b < 100) {
                        data[i+3] = 0; // Transparente
                    }
                }
                tCtx.putImageData(imgData, 0, 0);
                return tempCanvas;
            } catch(e) { return img; }
        }

        Object.keys(assets).forEach(key => {
            assets[key].onload = () => {
                processedAssets[key] = removeGreenScreen(assets[key]);
                assetsLoaded++;
            };
        });

        // Nuvens para textura do Fundo
        const clouds = [
            {x: 100, y: 50, w: 60, h: 20}, {x: 120, y: 40, w: 40, h: 40},
            {x: 400, y: 80, w: 80, h: 25}, {x: 420, y: 60, w: 50, h: 50},
            {x: 800, y: 40, w: 70, h: 20}, {x: 820, y: 30, w: 30, h: 40},
            {x: 1200, y: 70, w: 90, h: 30}, {x: 1230, y: 50, w: 40, h: 60},
            {x: 1600, y: 50, w: 60, h: 20}, {x: 1620, y: 40, w: 40, h: 40},
            {x: 2000, y: 80, w: 80, h: 25}, {x: 2020, y: 60, w: 50, h: 50},
            {x: 2500, y: 40, w: 70, h: 20}, {x: 2520, y: 30, w: 30, h: 40},
            {x: 2900, y: 70, w: 90, h: 30}, {x: 2930, y: 50, w: 40, h: 60},
        ];

        // ==========================================
        // LÓGICA DO JOGO E FÍSICA
        // ==========================================
        const keys = { left: false, right: false, up: false, down: false };

        // Hitbox do Jogador exata (Não voa mais)
        const player = {
            x: 50, y: 100, w: 24, h: 40, 
            vx: 0, vy: 0,
            speed: 5, jumpPower: -13, gravity: 0.6,
            grounded: false, isCrouching: false, direction: 1, 
            animFrame: 0, animTimer: 0
        };

        const princess = { x: 3400, y: 340, w: 32, h: 40 };
        const castle = { x: 3450, y: 130, w: 250, h: 250 };

        let enemies = [
            { x: 600, y: 332, w: 32, h: 32, vx: -1.5, type: 'mushroom', alive: true },
            { x: 1200, y: 332, w: 32, h: 32, vx: -1.5, type: 'mushroom', alive: true },
            { x: 1800, y: 332, w: 32, h: 32, vx: -2, type: 'turtle', alive: true },
            { x: 2200, y: 332, w: 32, h: 32, vx: -2, type: 'turtle', alive: true }
        ];

        let cameraX = 0;
        let gameWin = false;

        // MAPA DA FASE (Chão com altura de 150 para tapar o fundo)
        const blocks = [
            // CHÃO
            { x: 0, y: 380, w: 1200, h: 150, type: 'ground' },
            { x: 1300, y: 380, w: 800, h: 150, type: 'ground' }, 
            { x: 2250, y: 380, w: 1800, h: 150, type: 'ground' }, 

            // CANOS 
            { x: 400, y: 300, w: 60, h: 80, type: 'pipe' },
            { x: 750, y: 260, w: 60, h: 120, type: 'pipe' },
            { x: 950, y: 260, w: 60, h: 120, type: 'pipe' }, 

            // BLOCOS AÉREOS
            { x: 250, y: 220, w: 48, h: 48, type: 'surprise' },
            
            { x: 500, y: 220, w: 48, h: 48, type: 'brick' },
            { x: 548, y: 220, w: 48, h: 48, type: 'surprise' },
            { x: 596, y: 220, w: 48, h: 48, type: 'brick' },
            
            // ESCADINHA
            { x: 2900, y: 332, w: 48, h: 48, type: 'brick' },
            { x: 2948, y: 284, w: 48, h: 96, type: 'brick' },
            { x: 2996, y: 236, w: 48, h: 144, type: 'brick' },
            { x: 3044, y: 188, w: 48, h: 192, type: 'brick' },
        ];

        // Mapeamento de Teclado
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
        });

        // Mapeamento de Touch e Mouse
        function bindInput(id, keyStr) {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); keys[keyStr] = true; };
            const release = (e) => { e.preventDefault(); keys[keyStr] = false; };
            
            btn.addEventListener('touchstart', press);
            btn.addEventListener('touchend', release);
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release); // Previne agarrar a tecla
        }
        bindInput('btn-left', 'left');
        bindInput('btn-right', 'right');
        bindInput('btn-down', 'down');
        bindInput('btn-up', 'up');
        bindInput('btn-jump', 'up');

        function isColliding(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        window.reiniciarFase = function() {
            player.x = 50; player.y = 100; player.vx = 0; player.vy = 0;
            cameraX = 0; gameWin = false;
            enemies.forEach(e => { e.alive = true; });
        }

        function update() {
            if(gameWin || assetsLoaded < totalAssets) return;

            // Movimento Horizontal
            if (keys.left && !keys.down) { player.vx = -player.speed; player.direction = -1; }
            else if (keys.right && !keys.down) { player.vx = player.speed; player.direction = 1; }
            else player.vx = 0;

            // Agachar
            if (keys.down && player.grounded) {
                if(!player.isCrouching) { player.isCrouching = true; player.h = 24; player.y += 16; }
            } else if (player.isCrouching) {
                player.isCrouching = false; player.y -= 16; player.h = 40;
            }

            // Pulo
            if (keys.up && player.grounded && !keys.down) {
                player.vy = player.jumpPower; player.grounded = false;
            }

            // Gravidade
            player.vy += player.gravity;
            player.grounded = false;

            // Colisão Eixo X
            player.x += player.vx;
            if (player.x < cameraX) player.x = cameraX;

            for (let b of blocks) {
                if (isColliding(player, b)) {
                    if (player.vx > 0) player.x = b.x - player.w;
                    else if (player.vx < 0) player.x = b.x + b.w;
                    player.vx = 0;
                }
            }

            // Colisão Eixo Y
            player.y += player.vy;
            for (let b of blocks) {
                if (isColliding(player, b)) {
                    if (player.vy > 0) { 
                        player.y = b.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) { 
                        player.y = b.y + b.h;
                        player.vy = 0;
                    }
                }
            }

            if (player.y > GAME_HEIGHT + 200) reiniciarFase();

            // Inimigos
            for (let enemy of enemies) {
                if (!enemy.alive) continue;
                
                enemy.y += 4; 
                for (let b of blocks) {
                    if (isColliding(enemy, b)) { enemy.y = b.y - enemy.h; break; }
                }

                enemy.x += enemy.vx;
                for (let b of blocks) {
                    if (b.type !== 'ground' && isColliding(enemy, b)) {
                        if (enemy.vx < 0) { enemy.x = b.x + b.w; enemy.vx *= -1; }
                        else { enemy.x = b.x - enemy.w; enemy.vx *= -1; }
                    }
                }

                if (isColliding(player, enemy)) {
                    if (player.vy > 0 && player.y + player.h < enemy.y + 15) {
                        enemy.alive = false; 
                        player.vy = player.jumpPower * 0.8;
                    } else {
                        reiniciarFase(); 
                    }
                }
            }

            if (isColliding(player, princess)) gameWin = true;

            // Scroll da Câmera
            if (player.x > cameraX + GAME_WIDTH / 2.5) {
                cameraX = player.x - GAME_WIDTH / 2.5;
            }

            // Animação
            if (player.isCrouching) {
                player.animFrame = 3;
            } else if (!player.grounded) {
                player.animFrame = 2;
            } else if (player.vx !== 0) {
                player.animTimer++;
                if (player.animTimer > 8) { player.animFrame = player.animFrame === 1 ? 0 : 1; player.animTimer = 0; }
            } else {
                player.animFrame = 0;
            }
        }

        function drawImageTile(img, dx, dy, dw, dh, isGround = false) {
            if(!img) return;
            if(isGround) {
                // Desenha a grama em cima
                const tileW = 48;
                for(let i = 0; i < dw; i += tileW) {
                    let w = Math.min(tileW, dw - i);
                    ctx.drawImage(img, 0, 0, w * (img.width/tileW), img.height, dx + i, dy, w, 48);
                }
                // Preenche a terra por baixo para cobrir espaços vazios
                ctx.fillStyle = '#9b5b29';
                ctx.fillRect(dx, dy + 48, dw, dh - 48);
            } else {
                ctx.drawImage(img, dx, dy, dw, dh);
            }
        }

        function draw() {
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (assetsLoaded < totalAssets) {
                ctx.fillStyle = '#fff'; ctx.font = '20px "Press Start 2P"'; ctx.textAlign = 'center';
                ctx.fillText("CARREGANDO A MAGIA...", GAME_WIDTH/2, GAME_HEIGHT/2);
                return;
            }

            ctx.save();
            ctx.translate(-cameraX, 0); 
            
            // Desenha as Nuvens
            ctx.fillStyle = '#ffffff';
            for (let c of clouds) {
                let cx = c.x - (cameraX * 0.2); // Efeito Parallax suave
                // Se a nuvem sair do ecrã, volta pelo outro lado
                cx = cx % (GAME_WIDTH * 4);
                if (cx < -200) cx += (GAME_WIDTH * 4);
                
                ctx.fillRect(cx, c.y, c.w, c.h);
                ctx.fillRect(cx + 10, c.y - 10, c.w - 20, c.h + 20);
            }

            // Cenário
            for (let b of blocks) {
                if (b.type === 'ground') drawImageTile(processedAssets.ground, b.x, b.y, b.w, b.h, true);
                if (b.type === 'pipe') drawImageTile(processedAssets.pipe, b.x, b.y, b.w, b.h);
                if (b.type === 'brick') drawImageTile(processedAssets.brick, b.x, b.y, b.w, b.h);
                if (b.type === 'surprise') drawImageTile(processedAssets.surprise, b.x, b.y, b.w, b.h);
                if (b.type === 'block') drawImageTile(processedAssets.brick, b.x, b.y, b.w, b.h);
            }

            // Castelo e Princesa
            drawImageTile(processedAssets.castle, castle.x, castle.y, castle.w, castle.h);
            
            ctx.save();
            ctx.translate(princess.x + princess.w/2, princess.y + princess.h);
            ctx.drawImage(processedAssets.princess, -24, -48, 48, 48); // Desenha a Vitoria certinha
            ctx.restore();
            
            // Inimigos
            for (let enemy of enemies) {
                if(enemy.alive) {
                    const img = processedAssets.enemies;
                    const frameW = img.width / 2; 
                    const frameX = enemy.type === 'mushroom' ? 0 : frameW;
                    
                    ctx.save();
                    ctx.translate(enemy.x + enemy.w/2, enemy.y + enemy.h/2);
                    
                    // CORREÇÃO DO MOONWALK DOS MONSTROS
                    if (enemy.type === 'mushroom' && enemy.vx < 0) ctx.scale(-1, 1);
                    if (enemy.type === 'mushroom' && enemy.vx > 0) ctx.scale(1, 1);
                    if (enemy.type === 'turtle' && enemy.vx > 0) ctx.scale(-1, 1);
                    if (enemy.type === 'turtle' && enemy.vx < 0) ctx.scale(1, 1);
                    
                    ctx.drawImage(img, frameX, 0, frameW, img.height, -enemy.w/2 - 8, -enemy.h/2 - 8, enemy.w + 16, enemy.h + 16);
                    ctx.restore();
                }
            }

            // JOGADOR (GABRIEL)
            const spriteSheet = processedAssets.hero;
            const frameWidth = spriteSheet.width / 4;
            
            ctx.save();
            ctx.translate(player.x + player.w/2, player.y + player.h); // Ponto âncora nos pés
            if (player.direction === -1) ctx.scale(-1, 1); 
            
            ctx.drawImage(
                spriteSheet, 
                player.animFrame * frameWidth, 0, frameWidth, spriteSheet.height, 
                -24, -50, 48, 52 // Ajuste visual para não flutuar
            );
            ctx.restore();

            // Mensagem de Vitória
            if(gameWin) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(cameraX, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = '20px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText("VOCÊ RESGATOU A VITORIA!", cameraX + GAME_WIDTH/2, GAME_HEIGHT/2 - 20);
                
                ctx.font = '10px "Press Start 2P"';
                ctx.fillStyle = '#f43f5e';
                ctx.fillText("Parabéns, meu herói ❤️", cameraX + GAME_WIDTH/2, GAME_HEIGHT/2 + 20);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
