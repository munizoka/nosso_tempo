<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Super Gabriel Bros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #5c94fc; touch-action: none; font-family: 'Press Start 2P', cursive; }
        
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated; 
        }

        /* D-Pad Estilo Consola */
        .dpad-container {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 4px;
        }
        .dpad-btn {
            background: #cbd5e1;
            border: 4px solid #475569;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 28px;
            color: #334155;
            box-shadow: 0 6px 0 #334155;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
        }
        .dpad-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #334155; background: #94a3b8; }
        
        #btn-up { grid-column: 2; grid-row: 1; border-radius: 12px 12px 4px 4px; }
        #btn-left { grid-column: 1; grid-row: 2; border-radius: 12px 4px 4px 12px; }
        #btn-right { grid-column: 3; grid-row: 2; border-radius: 4px 12px 12px 4px; }
        #btn-down { grid-column: 2; grid-row: 3; border-radius: 4px 4px 12px 12px; }
        .dpad-center { grid-column: 2; grid-row: 2; background: #cbd5e1; border: none; }

        /* Botão A (Pular) */
        .action-btn {
            width: 90px;
            height: 90px;
            background: #ef4444;
            border: 6px solid #f87171;
            border-radius: 50%;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 8px 0 #991b1b, 0 15px 25px rgba(0,0,0,0.5);
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
        }
        .action-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #991b1b, 0 5px 10px rgba(0,0,0,0.5); background: #dc2626; }

        .ui-text { text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; color: white; font-size: 14px; }
    </style>
</head>
<body>

    <div id="orientation-warning" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center text-white md:hidden portrait:flex landscape:hidden">
        <span class="text-6xl mb-4 animate-bounce">📱🔄</span>
        <h2 class="text-sm text-center px-4 leading-relaxed font-sans">Gire o celular na horizontal<br>para jogar!</h2>
    </div>

    <div class="absolute top-4 left-4 right-4 z-50 flex justify-between items-start pointer-events-none">
        <a href="index.html" class="w-12 h-12 bg-zinc-800/80 border-2 border-white rounded-full flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg text-2xl active:scale-90 transition-transform">←</a>
        
        <div class="flex gap-6 ui-text items-center mt-2 hidden sm:flex">
            <span>HP:8900</span>
            <span>🍄 x10</span>
            <span>⏱ 00:03:18</span>
        </div>

        <button onclick="reiniciarFase()" class="px-4 py-3 bg-zinc-800/80 border-2 border-white rounded-xl flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg active:scale-95 transition-transform text-sm uppercase">
            🔄 Recomeçar
        </button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div class="fixed inset-0 pointer-events-none z-40 flex justify-between items-end pb-8 px-10 landscape:flex portrait:hidden sm:flex">
        <div class="dpad-container pointer-events-auto opacity-80 hover:opacity-100 transition-opacity">
            <div class="dpad-center"></div>
            <button id="btn-up" class="dpad-btn">▲</button>
            <button id="btn-left" class="dpad-btn">◀</button>
            <button id="btn-right" class="dpad-btn">▶</button>
            <button id="btn-down" class="dpad-btn">▼</button>
        </div>
        <div class="pointer-events-auto pb-4 opacity-90 hover:opacity-100 transition-opacity">
            <button id="btn-jump" class="action-btn">A</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; // Mantém os pixels nítidos, sem borrar a pixel art

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 450;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // ==========================================
        // SISTEMA DE IMAGENS E CHROMA KEY
        // ==========================================
        const assets = {
            hero: new Image(),
            princess: new Image(),
            enemies: new Image(),
            castle: new Image(),
            surprise: new Image(),
            pipe: new Image(),
            brick: new Image(),
            ground: new Image()
        };

        let assetsLoaded = 0;
        const totalAssets = 8;
        let processedAssets = {};

        assets.hero.src = '35.png';
        assets.princess.src = '36.png';
        assets.enemies.src = '37.jpg'; 
        assets.castle.src = '38.png';
        assets.surprise.src = '39.png';
        assets.pipe.src = '40.png';
        assets.brick.src = '41.png';
        assets.ground.src = '42.png';

        // Remove somente o FUNDO verde conectado às bordas.
        // Assim, não apaga a grama nem o verde do casco da tartaruga e dos canos.
        function removeGreenScreen(img) {
            const result = document.createElement('canvas');
            result.width = img.naturalWidth;
            result.height = img.naturalHeight;
            const g = result.getContext('2d', { willReadFrequently: true });
            g.drawImage(img, 0, 0);

            const pixels = g.getImageData(0, 0, result.width, result.height);
            const data = pixels.data;
            const w = result.width, h = result.height;
            const visited = new Uint8Array(w * h);
            const queue = new Int32Array(w * h);
            let head = 0, tail = 0;

            function looksLikeGreenScreen(p) {
                const i = p * 4;
                const r = data[i], green = data[i + 1], b = data[i + 2];
                // Compatível também com pequenas variações de compressão JPEG.
                return green >= 155 && green > r * 1.65 && green > b * 1.65
                    && r <= 165 && b <= 165;
            }
            function add(p) {
                if (!visited[p]) {
                    visited[p] = 1;
                    if (looksLikeGreenScreen(p)) queue[tail++] = p;
                }
            }

            // O chroma key começa nas quatro bordas da imagem.
            for (let x = 0; x < w; x++) {
                add(x);
                add((h - 1) * w + x);
            }
            for (let y = 0; y < h; y++) {
                add(y * w);
                add(y * w + w - 1);
            }
            while (head < tail) {
                const p = queue[head++];
                data[p * 4 + 3] = 0;
                const x = p % w;
                if (x > 0) add(p - 1);
                if (x < w - 1) add(p + 1);
                if (p >= w) add(p - w);
                if (p < (h - 1) * w) add(p + w);
            }
            g.putImageData(pixels, 0, 0);
            return result;
        }

        // Retira o espaço transparente EXTERNO de um sprite.
        function trimTransparent(canvasSource) {
            const w = canvasSource.width, h = canvasSource.height;
            const g = canvasSource.getContext('2d', { willReadFrequently: true });
            const pixels = g.getImageData(0, 0, w, h).data;
            let left = w, top = h, right = -1, bottom = -1;

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (pixels[(y * w + x) * 4 + 3] > 12) {
                        left = Math.min(left, x);
                        top = Math.min(top, y);
                        right = Math.max(right, x);
                        bottom = Math.max(bottom, y);
                    }
                }
            }
            if (right < left) return canvasSource;
            const out = document.createElement('canvas');
            out.width = right - left + 1;
            out.height = bottom - top + 1;
            const outCtx = out.getContext('2d');
            outCtx.imageSmoothingEnabled = false;
            outCtx.drawImage(canvasSource, left, top, out.width, out.height,
                             0, 0, out.width, out.height);
            return out;
        }

        // A folha de sprites do Gabriel tem 4 quadros; a dos inimigos, 2.
        // Recortar cada quadro SEPARADAMENTE evita que as margens causem levitação.
        function makeFrames(sheet, count) {
            const frames = [];
            const frameW = Math.floor(sheet.width / count);
            for (let i = 0; i < count; i++) {
                const frame = document.createElement('canvas');
                frame.width = frameW;
                frame.height = sheet.height;
                frame.getContext('2d').drawImage(
                    sheet, i * frameW, 0, frameW, sheet.height,
                    0, 0, frameW, sheet.height
                );
                frames.push(trimTransparent(frame));
            }
            return frames;
        }

        Object.keys(assets).forEach(key => {
            assets[key].onload = () => {
                try {
                    const transparent = removeGreenScreen(assets[key]);
                    if (key === 'hero') {
                        processedAssets.heroFrames = makeFrames(transparent, 4);
                    } else if (key === 'enemies') {
                        processedAssets.enemyFrames = makeFrames(transparent, 2);
                    } else {
                        processedAssets[key] = trimTransparent(transparent);
                    }
                    assetsLoaded++;
                } catch (err) {
                    console.error('Erro ao preparar sprite:', key, err);
                }
            };
            assets[key].onerror = () => console.error('Imagem não encontrada:', assets[key].src);
        });

        const clouds = [
            {x: 100, y: 50, w: 60, h: 20}, {x: 120, y: 40, w: 40, h: 40},
            {x: 400, y: 80, w: 80, h: 25}, {x: 420, y: 60, w: 50, h: 50},
            {x: 800, y: 40, w: 70, h: 20}, {x: 820, y: 30, w: 30, h: 40},
            {x: 1200, y: 70, w: 90, h: 30}, {x: 1230, y: 50, w: 40, h: 60},
            {x: 1600, y: 50, w: 60, h: 20}, {x: 1620, y: 40, w: 40, h: 40},
            {x: 2000, y: 80, w: 80, h: 25}, {x: 2020, y: 60, w: 50, h: 50},
            {x: 2500, y: 40, w: 70, h: 20}, {x: 2520, y: 30, w: 30, h: 40},
            {x: 2900, y: 70, w: 90, h: 30}, {x: 2930, y: 50, w: 40, h: 60},
        ];

        // ==========================================
        // LÓGICA DO JOGO E FÍSICA
        // ==========================================
        const keys = { left: false, right: false, up: false, down: false };

        const player = {
            x: 50, y: 100, w: 24, h: 40, 
            vx: 0, vy: 0,
            speed: 5.5, jumpPower: -13, gravity: 0.6,
            grounded: false, isCrouching: false, direction: 1, 
            animFrame: 0, animTimer: 0
        };

        const princess = { x: 3400, y: 380 - 48, w: 32, h: 48 };
        const castle = { x: 3450, y: 380 - 200, w: 200, h: 200 };

        let enemies = [
            { x: 600, y: 380 - 32, w: 32, h: 32, vx: -1.5, type: 'mushroom', alive: true },
            { x: 1200, y: 380 - 32, w: 32, h: 32, vx: -1.5, type: 'mushroom', alive: true },
            { x: 1800, y: 380 - 32, w: 32, h: 32, vx: -2, type: 'turtle', alive: true },
            { x: 2200, y: 380 - 32, w: 32, h: 32, vx: -2, type: 'turtle', alive: true }
        ];

        let cameraX = 0;
        let gameWin = false;

        const blocks = [
            // CHÃO
            { x: 0, y: 380, w: 1200, h: 150, type: 'ground' },
            { x: 1300, y: 380, w: 800, h: 150, type: 'ground' }, 
            { x: 2250, y: 380, w: 1800, h: 150, type: 'ground' }, 

            // CANOS 
            { x: 400, y: 380 - 80, w: 60, h: 80, type: 'pipe' },
            { x: 750, y: 380 - 120, w: 60, h: 120, type: 'pipe' },
            { x: 950, y: 380 - 120, w: 60, h: 120, type: 'pipe' }, 

            // BLOCOS AÉREOS
            { x: 250, y: 220, w: 48, h: 48, type: 'surprise' },
            { x: 500, y: 220, w: 48, h: 48, type: 'brick' },
            { x: 548, y: 220, w: 48, h: 48, type: 'surprise' },
            { x: 596, y: 220, w: 48, h: 48, type: 'brick' },
            
            // ESCADINHA
            { x: 2900, y: 380 - 48, w: 48, h: 48, type: 'brick' },
            { x: 2948, y: 380 - 96, w: 48, h: 96, type: 'brick' },
            { x: 2996, y: 380 - 144, w: 48, h: 144, type: 'brick' },
            { x: 3044, y: 380 - 192, w: 48, h: 192, type: 'brick' },
        ];

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
        });

        function bindInput(id, keyStr) {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); keys[keyStr] = true; };
            const release = (e) => { e.preventDefault(); keys[keyStr] = false; };
            
            btn.addEventListener('touchstart', press);
            btn.addEventListener('touchend', release);
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }
        bindInput('btn-left', 'left');
        bindInput('btn-right', 'right');
        bindInput('btn-down', 'down');
        bindInput('btn-up', 'up');
        bindInput('btn-jump', 'up');

        function isColliding(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        window.reiniciarFase = function() {
            player.x = 50; player.y = 100; player.vx = 0; player.vy = 0;
            cameraX = 0; gameWin = false;
            enemies.forEach(e => { e.alive = true; });
        }

        function update() {
            if(gameWin || assetsLoaded < totalAssets) return;

            if (keys.left && !keys.down) { player.vx = -player.speed; player.direction = -1; }
            else if (keys.right && !keys.down) { player.vx = player.speed; player.direction = 1; }
            else player.vx = 0;

            if (keys.down && player.grounded) {
                if(!player.isCrouching) { player.isCrouching = true; player.h = 24; player.y += 16; }
            } else if (player.isCrouching) {
                player.isCrouching = false; player.y -= 16; player.h = 40;
            }

            if (keys.up && player.grounded && !keys.down) {
                player.vy = player.jumpPower; player.grounded = false;
            }

            player.vy += player.gravity;
            player.grounded = false;

            player.x += player.vx;
            if (player.x < cameraX) player.x = cameraX;

            for (let b of blocks) {
                if (isColliding(player, b)) {
                    if (player.vx > 0) player.x = b.x - player.w;
                    else if (player.vx < 0) player.x = b.x + b.w;
                    player.vx = 0;
                }
            }

            player.y += player.vy;
            for (let b of blocks) {
                if (isColliding(player, b)) {
                    if (player.vy > 0) { 
                        player.y = b.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) { 
                        player.y = b.y + b.h;
                        player.vy = 0;
                    }
                }
            }

            if (player.y > GAME_HEIGHT + 200) reiniciarFase();

            for (let enemy of enemies) {
                if (!enemy.alive) continue;
                
                enemy.y += 4; 
                for (let b of blocks) {
                    if (isColliding(enemy, b)) { enemy.y = b.y - enemy.h; break; }
                }

                enemy.x += enemy.vx;
                for (let b of blocks) {
                    if (b.type !== 'ground' && isColliding(enemy, b)) {
                        if (enemy.vx < 0) { enemy.x = b.x + b.w; enemy.vx *= -1; }
                        else { enemy.x = b.x - enemy.w; enemy.vx *= -1; }
                    }
                }

                if (isColliding(player, enemy)) {
                    if (player.vy > 0 && player.y + player.h < enemy.y + 15) {
                        enemy.alive = false; 
                        player.vy = player.jumpPower * 0.8;
                    } else {
                        reiniciarFase(); 
                    }
                }
            }

            if (isColliding(player, princess)) gameWin = true;

            if (player.x > cameraX + GAME_WIDTH / 2.5) {
                cameraX = player.x - GAME_WIDTH / 2.5;
            }

            if (player.isCrouching) {
                player.animFrame = 3;
            } else if (!player.grounded) {
                player.animFrame = 2;
            } else if (player.vx !== 0) {
                player.animTimer++;
                if (player.animTimer > 8) { player.animFrame = player.animFrame === 1 ? 0 : 1; player.animTimer = 0; }
            } else {
                player.animFrame = 0;
            }
        }

        // ==========================================
        // CHÃO CONTÍNUO (GRAMA EM CIMA, TERRA EMBAIXO)
        // ==========================================
        function drawGround(img, b) {
            if (!img) return;
            const tile = 32;  // Largura/altura visível de cada repetição
            // Evita repetir as bordas pretas laterais do desenho original.
            const side = Math.max(1, Math.floor(img.width * 0.035));
            const srcW = Math.max(1, img.width - side * 2);
            // Pedaço só de terra, sem grama nem a borda preta inferior.
            const dirtY = Math.floor(img.height * 0.42);
            const dirtH = Math.max(1, Math.floor(img.height * 0.42));

            ctx.save();
            ctx.beginPath();
            ctx.rect(b.x, b.y, b.w, b.h); // preserva os buracos reais da fase
            ctx.clip();
            ctx.fillStyle = '#a85a28';
            ctx.fillRect(b.x, b.y, b.w, b.h);

            for (let x = b.x; x < b.x + b.w; x += tile) {
                // Primeira fileira: o bloco de grama completo.
                ctx.drawImage(img, side, 0, srcW, img.height,
                              x, b.y, tile, tile);
                // Fileiras abaixo: apenas a textura da terra.
                for (let y = b.y + tile; y < b.y + b.h; y += tile) {
                    ctx.drawImage(img, side, dirtY, srcW, dirtH,
                                  x, y, tile, tile);
                }
            }
            ctx.restore();
        }

        function drawImageTile(img, dx, dy, dw, dh, type = '') {
            if (!img) return;
            if (type === 'ground') {
                drawGround(img, { x: dx, y: dy, w: dw, h: dh });
            } else {
                // Os sprites agora estão recortados, então NÃO precisam de 'bleed'.
                ctx.drawImage(img, Math.round(dx), Math.round(dy), dw, dh);
            }
        }

        // Coloca a base VISÍVEL do sprite exatamente na base da colisão.
        function drawSpriteOnFeet(sprite, centerX, footY, height, facing = 1) {
            if (!sprite) return;
            const width = Math.max(1, Math.round(height * sprite.width / sprite.height));
            ctx.save();
            ctx.translate(Math.round(centerX), Math.round(footY));
            if (facing === -1) ctx.scale(-1, 1);
            ctx.drawImage(sprite, -Math.round(width / 2), -height, width, height);
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (assetsLoaded < totalAssets) {
                ctx.fillStyle = '#fff'; ctx.font = '20px "Press Start 2P"'; ctx.textAlign = 'center';
                ctx.fillText("CARREGANDO A MAGIA...", GAME_WIDTH/2, GAME_HEIGHT/2);
                return;
            }

            // Nuvens em coordenadas de TELA (parallax de 20%, sem deslocar 120%).
            ctx.fillStyle = '#ffffff';
            for (let c of clouds) {
                let cx = (c.x - cameraX * 0.2) % (GAME_WIDTH * 4);
                if (cx < -200) cx += GAME_WIDTH * 4;
                cx = Math.round(cx);
                ctx.fillRect(cx, c.y, c.w, c.h);
                ctx.fillRect(cx + 10, c.y - 10, c.w - 20, c.h + 20);
            }

            ctx.save();
            ctx.translate(-Math.round(cameraX), 0);

            for (let b of blocks) {
                drawImageTile(processedAssets[b.type], b.x, b.y, b.w, b.h, b.type);
            }

            drawImageTile(processedAssets.castle, castle.x, castle.y, castle.w, castle.h);
            
            // A princesa, os inimigos e o Gabriel encostam os PÉS na colisão.
            drawSpriteOnFeet(processedAssets.princess,
                             princess.x + princess.w / 2, princess.y + princess.h,
                             princess.h);

            for (let enemy of enemies) {
                if (!enemy.alive) continue;
                const frame = processedAssets.enemyFrames[
                    enemy.type === 'mushroom' ? 0 : 1
                ];
                const facing = enemy.type === 'mushroom'
                    ? (enemy.vx < 0 ? -1 : 1)
                    : (enemy.vx > 0 ? -1 : 1);
                drawSpriteOnFeet(frame, enemy.x + enemy.w / 2,
                                 enemy.y + enemy.h, enemy.h, facing);
            }

            drawSpriteOnFeet(processedAssets.heroFrames[player.animFrame],
                             player.x + player.w / 2, player.y + player.h,
                             player.h, player.direction);

            if(gameWin) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(cameraX, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = '20px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText("VITORIA RESGATADA!", cameraX + GAME_WIDTH/2, GAME_HEIGHT/2 - 20);
                
                ctx.font = '10px "Press Start 2P"';
                ctx.fillStyle = '#f43f5e';
                ctx.fillText("Parabéns, meu herói ❤️", cameraX + GAME_WIDTH/2, GAME_HEIGHT/2 + 20);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
