<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Gabriel Bros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#131628;touch-action:none;font-family:'Press Start 2P',cursive;}
        #game-shell {position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;}
        #game-canvas {display:block;width:800px;height:450px;max-width:100%;max-height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#d7c6a6;touch-action:none;}
        #game-hud {top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));}
        .game-control-panel {position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom));z-index:40;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;}
        .game-control-panel button {pointer-events:auto;touch-action:none;}
        .game-dpad {display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:5px;align-items:end;}
        .game-dpad #btn-up {grid-column:2;grid-row:1;}
        .game-dpad #btn-left {grid-column:1;grid-row:2;}
        .game-dpad #btn-down {grid-column:2;grid-row:2;}
        .game-dpad #btn-right {grid-column:3;grid-row:2;}
        #btn-up, #btn-down {display:none;}
        body.map-mode #btn-up,body.map-mode #btn-down {display:flex;}
        body.map-mode #ui-score,body.map-mode #ui-lives,body.map-mode #ui-time,body.map-mode #ui-level {display:none;}
        body.map-mode #btn-jump {background:#6551eb;border-color:#a5b4fc;box-shadow:0 6px 0 #312e81;}
        @media (pointer:fine) and (min-width:900px) {.game-control-panel {opacity:0;visibility:hidden;}}
        @media (max-height:540px), (max-width:700px) {
            .dpad-btn {width:clamp(38px,10dvh,56px)!important;height:clamp(38px,10dvh,56px)!important;border-width:2px!important;font-size:22px!important;box-shadow:0 3px 0 #334155!important;}
            .action-btn {width:clamp(49px,15dvh,70px)!important;height:clamp(49px,15dvh,70px)!important;border-width:3px!important;font-size:22px!important;box-shadow:0 4px 0 #991b1b!important;}
            #game-hud a,#game-hud button {min-height:34px;min-width:34px;padding:6px 9px;font-size:11px;}
            #game-hud .hud-stats {gap:9px;font-size:8px;}
        }
        @media (orientation:portrait) and (max-width:800px) {
            #game-shell {padding-top:58px;padding-bottom:155px;}
            #game-hud {z-index:55;}
            .game-control-panel {bottom:max(14px,env(safe-area-inset-bottom));}
        }

        /* D-Pad Estilo Minimalista (Apenas Laterais) */
        .dpad-btn {
            width: 70px;
            height: 70px;
            background: #cbd5e1;
            border: 4px solid #475569;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 32px;
            color: #334155;
            box-shadow: 0 6px 0 #334155;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
        }
        .dpad-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #334155; background: #94a3b8; }

        /* Botão A (Pular) */
        .action-btn {
            width: 90px;
            height: 90px;
            background: #ef4444;
            border: 6px solid #f87171;
            border-radius: 50%;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 8px 0 #991b1b, 0 15px 25px rgba(0,0,0,0.5);
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
        }
        .action-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #991b1b, 0 5px 10px rgba(0,0,0,0.5); background: #dc2626; }

        .ui-text { text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; color: white; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Em modo retrato, o mapa e o jogo continuam funcionais, sem forçar rotação. -->

    <!-- Interface Superior (Score, Tempo, Mapa e Recomeçar) -->
    <div id="game-hud" class="absolute z-50 flex justify-between items-start pointer-events-none">
        <a href="index.html" class="w-12 h-12 bg-zinc-800/80 border-2 border-white rounded-full flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg text-2xl active:scale-90 transition-transform">←</a>
        
        <div class="hud-stats flex gap-4 ui-text items-center mt-2 hidden sm:flex">
            <span id="ui-score">SCORE: 0</span>
            <span id="ui-lives">🍄 x5</span>
            <span id="ui-time">⏱ 00:00:00</span>
            <span id="ui-level">FASE: 1</span>
        </div>

        <div class="flex gap-2 pointer-events-auto">
            <button onclick="toggleInventario()" id="inventory-button" title="Inventário de pistas (tecla I)" aria-label="Abrir inventário" aria-expanded="false" class="px-3 py-2 bg-amber-950/90 border-2 border-amber-200 rounded-xl text-white font-sans font-bold shadow-lg text-sm">🎒 <span id="inventory-count">0</span></button>
            <button onclick="voltarAoMapa()" class="px-3 py-2 bg-indigo-900/80 border-2 border-white rounded-xl text-white font-sans font-bold shadow-lg text-sm" title="Voltar ao mapa">🗺️ Mapa</button>
            <button onclick="reiniciarFase()" class="px-4 py-3 bg-zinc-800/80 border-2 border-white rounded-xl flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg active:scale-95 transition-transform text-sm uppercase">
                🔄 Recomeçar
            </button>
        </div>
    </div>

    <div id="game-shell"><canvas id="game-canvas" aria-label="Super Gabriel Bros: mapa e fases"></canvas></div>
    <section id="inventory-panel" role="dialog" aria-label="Inventário de pistas" aria-modal="true" style="display:none;position:fixed;z-index:90;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:20px;">
      <div style="width:min(460px,95vw);background:#151324;color:#fff;border:3px solid #c6a86f;border-radius:14px;padding:24px;font-family:system-ui,sans-serif;box-shadow:0 20px 80px #000;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
          <strong style="font-size:19px;">🎒 Inventário de Gabriel</strong>
          <button id="inventory-close" onclick="toggleInventario()" aria-label="Fechar inventário" style="background:#322b45;border-radius:9px;color:white;padding:7px 12px;cursor:pointer;">✕</button>
        </div>
        <p id="inventory-description" style="font-size:14px;line-height:1.6;margin-top:18px;">Nenhuma pista encontrada ainda.</p>
        <p style="font-size:12px;color:#b6b0c6;margin-top:14px;">Pistas de história ficam guardadas neste navegador.</p>
      </div>
    </section>

    <!-- Controles Mobile -->
    <div id="mobile-controls" class="game-control-panel">
        
        <!-- Direcionais Limpos (Esquerda/Direita) -->
        <div class="game-dpad pointer-events-auto opacity-90">
            <button id="btn-up" class="dpad-btn" aria-label="Mover para cima">▲</button>
            <button id="btn-left" class="dpad-btn" aria-label="Mover para esquerda">◀</button>
            <button id="btn-down" class="dpad-btn" aria-label="Mover para baixo">▼</button>
            <button id="btn-right" class="dpad-btn" aria-label="Mover para direita">▶</button>
        </div>

        <div class="pointer-events-auto opacity-90 hover:opacity-100 transition-opacity">
            <button id="btn-jump" class="action-btn" aria-label="Pular ou escolher fase">A</button>
        </div>
    </div>

    <script>
        // SUPER GABRIEL BROS — fase 1 preservada + aparições recorrentes do vilão e Vitoria
        // Todos os arquivos de imagem estão na RAIZ do repositório.
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 450;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        ctx.imageSmoothingEnabled = false;
        // Canvas sempre inteiro na tela (sem object-fit:cover ou corte).
        function resizeGameCanvas() {
          const shell=document.getElementById('game-shell');
          if (!shell) return;
          const styles=getComputedStyle(shell);
          const maxWidth=Math.max(1,shell.clientWidth-parseFloat(styles.paddingLeft)-parseFloat(styles.paddingRight));
          const maxHeight=Math.max(1,shell.clientHeight-parseFloat(styles.paddingTop)-parseFloat(styles.paddingBottom));
          const scale=Math.min(maxWidth/GAME_WIDTH,maxHeight/GAME_HEIGHT);
          canvas.style.width=Math.floor(GAME_WIDTH*scale)+'px';
          canvas.style.height=Math.floor(GAME_HEIGHT*scale)+'px';
        }
        window.addEventListener('resize',resizeGameCanvas);
        window.addEventListener('orientationchange',resizeGameCanvas);
        if(window.visualViewport)window.visualViewport.addEventListener('resize',resizeGameCanvas);
        resizeGameCanvas();

        const HUD = {
          score: document.getElementById('ui-score'),
          lives: document.getElementById('ui-lives'),
          time: document.getElementById('ui-time'),
          level: document.getElementById('ui-level')
        };
        const keys = { left:false, right:false, up:false, down:false };
        let level = 1;
        let state = 'map'; // map | playing | cutscene | title2 | forestIntro | forestTotemCharge | forestOutro | title3 | skyIntro | skyAltarCharge | skyOutro | chapterEnd | gameover
        let cutsceneStart = 0;
        let cinematicSeconds = 0;
        let forestSceneStart = 0;
        let forestSceneSeconds = 0;
        let score = 0;
        let lives = 5;
        let elapsedSeconds = 0;
        let previousFrame = performance.now();
        let cameraX = 0;
        let sceneReady = false;
        let checkpointReached = false;
        let checkpointX = 0;
        let invulnerable = 0;
        let forestPlatforms = [];
        const FOREST_END = 3400;
        const testMode = new URLSearchParams(window.location.search).get('teste');
        const MAP_BOUNDS={left:62,right:738,top:99,bottom:376};
        const mapHead={x:139,y:319,r:17,speed:150};
        const levelComplete={1:false,2:false,3:false};
        const SKY_END=3280;
        const SKY_ALTAR_X=SKY_END-170;
        const SKY_ALTAR_CHARGE_MS=1450;
        // A fuga do vilão pela passagem celestial acontece antes do drink cair.
        const SKY_ESCAPE_START=18.9;
        const SKY_ESCAPE_FINISH=23.2;
        const SKY_DRINK_DROP_START=23.35;
        const SKY_DRINK_FLIGHT_MS=2750;
        const SKY_DRINK_ROLL_MS=850;
        const SKY_OUTRO_POSTSCENE_MS=3900;
        let skyAltarActivated=false,skyAltarActivatedAt=0,skySceneStart=0,skySceneSeconds=0;
        let skyCheckpointReached=false,skyCheckpointX=0;
        let skyBirds=[];
        // Totem da Floresta: 57.png (apagado) e 56.png (aceso).
        // A zona de ativação fica no chão, após o último obstáculo.
        const FOREST_GOAL_X=FOREST_END-430;
        const FOREST_TOTEM_X=FOREST_GOAL_X+40;
        const FOREST_TOTEM_CHARGE_MS=1350;
        const FOREST_CLUE_X=FOREST_END-170;
        const FOREST_OUTRO_DURATION=21.7;
        const INVENTORY_KEY='super-gabriel-bros-pistas-v1';
        let inventoryOpen=false;
        let hasVillainMedallion=false;
        try{hasVillainMedallion=JSON.parse(localStorage.getItem(INVENTORY_KEY)||'false')===true;}
        catch(e){hasVillainMedallion=false;}
        function renderInventory(){
          const count=document.getElementById('inventory-count');
          const description=document.getElementById('inventory-description');
          if(count)count.textContent=hasVillainMedallion?'1':'0';
          if(description)description.textContent=hasVillainMedallion
            ?'PISTA 01 — MEDALHÃO RACHADO. Caiu do manto do vilão quando ele fugiu da Floresta Misteriosa. Possui uma runa em forma de vento. Ainda não sabemos quem é o dono.'
            :'Nenhuma pista encontrada ainda. Explore os finais das fases para descobrir mais.';
        }
        function giveVillainMedallion(){
          if(hasVillainMedallion)return;
          hasVillainMedallion=true;
          try{localStorage.setItem(INVENTORY_KEY,'true');}catch(e){/* Continua na sessão. */}
          renderInventory();
        }
        window.toggleInventario=function(){
          if(!inventoryOpen&&!['map','playing','chapterEnd','gameover','title2','title3'].includes(state))return;
          inventoryOpen=!inventoryOpen;
          const panel=document.getElementById('inventory-panel');
          const button=document.getElementById('inventory-button');
          if(panel)panel.style.display=inventoryOpen?'flex':'none';
          if(button)button.setAttribute('aria-expanded',String(inventoryOpen));
          if(inventoryOpen){renderInventory();document.getElementById('inventory-close')?.focus();}
          else button?.focus();
        };
        renderInventory();
        let forestTotemActivated=false;
        let forestTotemActivatedAt=0;
        const mapLevels=[
          {id:1,name:'PRIMEIRA AVENTURA',x:139,y:319,open:true,color:'#ff6158'},
          {id:2,name:'FLORESTA MISTERIOSA',x:340,y:236,open:true,color:'#fab53c'},
          {id:3,name:'TEMPLO DOS VENTOS',x:674,y:163,open:true,color:'#91dafa'}
        ];
        let mapTip='MOVA A CABEÇA E ESCOLHA UMA FASE';
        function mapClosest() {
          let nearest=null,best=Infinity;
          for(const node of mapLevels){const d=Math.hypot(node.x-mapHead.x,node.y-mapHead.y);if(d<best){best=d;nearest=node;}}
          return best<=42?nearest:null;
        }
        function returnToMap() {
          state='map';keys.left=keys.right=keys.up=keys.down=false;
          mapTip='MOVA A CABEÇA E ESCOLHA UMA FASE';setHUD();
        }
        window.voltarAoMapa=returnToMap;
        function chooseMapLevel() {
          if(state!=='map')return;
          const node=mapClosest();
          if(!node){mapTip='APROXIME-SE DE UMA FASE';return;}
          if(!node.open){mapTip='FASE BLOQUEADA!';return;}
          level=node.id;
          state='playing';
          restartCurrentLevel();
          if(node.id===2)showForestTitle();
          else if(node.id===3)showSkyTitle();
          else state='playing';
          setHUD();
        }
        function updateMap(dt) {
          const dx=(keys.right?1:0)-(keys.left?1:0);
          const dy=(keys.down?1:0)-(keys.up?1:0);
          const norm=Math.hypot(dx,dy)||1;
          mapHead.x=Math.max(MAP_BOUNDS.left,Math.min(MAP_BOUNDS.right,mapHead.x+dx/norm*mapHead.speed*dt));
          mapHead.y=Math.max(MAP_BOUNDS.top,Math.min(MAP_BOUNDS.bottom,mapHead.y+dy/norm*mapHead.speed*dt));
        }
        function poly(points,color,stroke,width=3) {
          ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
          for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();
          ctx.fillStyle=color;ctx.fill();if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke();}
        }
        function retroText(str,x,y,size=10,color='#fff',align='center') {
          ctx.font=size+'px "Press Start 2P",monospace';ctx.textAlign=align;
          ctx.lineWidth=3;ctx.strokeStyle='#2a2632';ctx.strokeText(str,x,y);
          ctx.fillStyle=color;ctx.fillText(str,x,y);
        }
        function drawMap() {
          // Cenário original inspirado nos mapas 16-bit (não reutiliza a imagem de referência).
          const islandOuter=[[92,78],[209,67],[348,81],[407,107],[515,97],[690,96],[744,125],[752,255],[713,343],[627,372],[460,388],[284,375],[162,388],[98,333],[71,239]];
          const islandInner=[[101,80],[212,73],[341,89],[404,114],[516,103],[686,104],[738,128],[744,248],[708,337],[625,364],[459,379],[284,366],[165,380],[107,326],[81,235]];
          ctx.fillStyle='#e3d2b0';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
          for(let y=12;y<450;y+=43)for(let x=14;x<800;x+=65){
            if((x+y)%3===0){ctx.fillStyle='#fff8e4';ctx.fillRect(x,y,14,5);ctx.fillRect(x+5,y-5,5,15);}
          }
          ctx.fillStyle='#3c2e2c';ctx.fillRect(25,57,750,348);
          ctx.fillStyle='#4b8ce5';ctx.fillRect(29,61,742,340);
          for(let y=72;y<389;y+=20)for(let x=42;x<765;x+=32){
            if((x+y)%5===0){ctx.fillStyle='#b1e2ff';ctx.fillRect(x,y,9,3);}
          }
          poly(islandOuter,'#6fbb38','#305126',9);
          poly(islandInner,'#66d235','#b8f65e',4);
          // Bioma sombrio da FASE 2 no lado direito do mapa.
          ctx.save();
          ctx.beginPath();ctx.moveTo(islandInner[0][0],islandInner[0][1]);
          for(let i=1;i<islandInner.length;i++)ctx.lineTo(islandInner[i][0],islandInner[i][1]);ctx.closePath();
          ctx.clip();
          const darkGrad=ctx.createLinearGradient(410,120,760,360);
          darkGrad.addColorStop(0,'rgba(72,53,102,0.02)');
          darkGrad.addColorStop(.28,'rgba(73,55,111,0.18)');
          darkGrad.addColorStop(.62,'rgba(49,35,82,0.42)');
          darkGrad.addColorStop(1,'rgba(24,22,52,0.64)');
          ctx.fillStyle=darkGrad;ctx.fillRect(410,75,350,315);
          ctx.globalAlpha=.55;
          for(const p of [[564,149,110,40],[615,191,128,50],[596,279,122,54],[682,305,92,38]]){
            ctx.fillStyle='#423360';ctx.beginPath();ctx.ellipse(p[0],p[1],p[2]/2,p[3]/2,0,0,Math.PI*2);ctx.fill();
          }
          ctx.globalAlpha=.8;
          for(const [x,y] of [[606,150],[650,208],[626,282],[695,314]]){
            ctx.strokeStyle='#291a3f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+26);ctx.stroke();
            ctx.beginPath();ctx.moveTo(x-2,y+9);ctx.lineTo(x-14,y+2);ctx.moveTo(x-1,y+13);ctx.lineTo(x+12,y+5);ctx.moveTo(x-3,y+19);ctx.lineTo(x-16,y+22);ctx.stroke();
          }
          for(let i=0;i<8;i++){
            const mx=470+i*34,my=145+(i%2)*62;
            ctx.fillStyle='rgba(158,120,233,.17)';ctx.fillRect(mx,my,26,3);
            ctx.fillRect(mx+7,my+6,18,3);
          }
          ctx.restore();
          // A região celestial da Fase 3 cresce acima do setor sombrio da floresta.
          ctx.save();
          const celestial=ctx.createRadialGradient(666,151,6,666,151,107);
          celestial.addColorStop(0,'rgba(222,248,255,.90)');
          celestial.addColorStop(.65,'rgba(142,203,251,.75)');
          celestial.addColorStop(1,'rgba(142,203,251,0)');
          ctx.fillStyle=celestial;ctx.beginPath();ctx.ellipse(666,153,113,78,0,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='rgba(255,255,255,.75)';
          for(const [cx,cy] of [[610,124],[666,111],[708,138]]){
            ctx.fillRect(cx,cy,34,7);ctx.fillRect(cx+7,cy-7,20,8);
          }
          ctx.fillStyle='#f5dc94';ctx.fillRect(694,114,14,22);
          ctx.fillStyle='#fff6d6';ctx.fillRect(691,110,20,6);
          ctx.restore();
          // Lago e cachoeira nas laterais.
          poly([[406,180],[446,152],[508,168],[547,190],[545,220],[591,240],[573,285],[531,314],[476,301],[433,322],[392,293],[409,250]],'#387fe8','#233d78',8);
          poly([[408,178],[449,161],[502,174],[543,193],[535,219],[584,246],[565,282],[532,305],[475,294],[432,314],[402,291],[418,251]],'#5d9bf5','#b9e7fd',3);
          ctx.fillStyle='#3999ff';ctx.fillRect(39,63,51,327);
          for(let y=71;y<380;y+=16){ctx.fillStyle='#bee5fd';ctx.fillRect(48,y,14,3);ctx.fillRect(73,y+5,10,3);}
          // Caminho amarelado, com um nó para cada fase.
          const paths=[[[139,319],[227,319],[275,279],[340,236]],[[340,236],[340,176],[390,143],[612,143],[674,163]]];
          for(const pts of paths){ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);ctx.strokeStyle='#b38e53';ctx.lineWidth=25;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.strokeStyle='#fae8a9';ctx.lineWidth=18;ctx.stroke();}
          // Destaque sombrio sobre a trilha da Fase 2.
          ctx.beginPath();ctx.moveTo(340,236);ctx.lineTo(340,176);ctx.lineTo(390,143);ctx.lineTo(612,143);ctx.lineTo(674,163);
          ctx.strokeStyle='rgba(96,68,138,.9)';ctx.lineWidth=8;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
          // Árvores, colinas, canos e torres em pixel art.
          for(let n=0;n<24;n++){
            const x=107+((n*127)%599),y=113+((n*73)%237);
            if(Math.hypot(x-490,y-250)<112||Math.hypot(x-340,y-236)<36||Math.hypot(x-674,y-163)<35)continue;
            const spooky=x>510;
            ctx.fillStyle=spooky?'#21342f':'#275a29';ctx.fillRect(x-9,y+3,25,16);
            ctx.fillStyle=spooky?'#395247':'#258f2a';ctx.fillRect(x-8,y-6,21,20);
            ctx.fillStyle=spooky?'#8761be':'#7de047';ctx.fillRect(x-5,y-7,12,7);
          }
          for(const [x,y] of [[243,143],[274,172],[618,278],[684,298]]){
            const spooky=x>500;
            poly([[x-19,y+12],[x-10,y-13],[x+3,y-27],[x+17,y-12],[x+22,y+12]],spooky?'#7e648d':'#c59660',spooky?'#342541':'#5b4428',4);
            ctx.fillStyle=spooky?'#d8b0ee':'#f4ca8a';ctx.fillRect(x-7,y-12,8,12);
          }
          for(const [x,y] of [[633,275],[276,349]]){

        function cropSprite(img) {
          const c=document.createElement('canvas');
          c.width=img.naturalWidth;c.height=img.naturalHeight;
          c.getContext('2d').drawImage(img,0,0);
          return trimTransparent(c);
        }
        function removeGreenScreen(img) {
          const out = document.createElement('canvas');
          out.width = img.naturalWidth; out.height = img.naturalHeight;
          const g = out.getContext('2d', { willReadFrequently: true });
          g.drawImage(img, 0, 0);
          const px = g.getImageData(0, 0, out.width, out.height);
          const a = px.data;
          const w = out.width, h = out.height;
          const seen = new Uint8Array(w*h);
          const queue = new Int32Array(w*h);
          let head = 0, tail = 0;
          function green(p) {
            const i = p*4, r = a[i], gg = a[i+1], b = a[i+2];
            return gg >= 155 && gg > r*1.65 && gg > b*1.65 && r <= 165 && b <= 165;
          }
          function add(p) { if(!seen[p]) { seen[p]=1; if(green(p)) queue[tail++]=p; } }
          for(let x=0;x<w;x++){ add(x);add((h-1)*w+x); }
          for(let y=0;y<h;y++){ add(y*w);add(y*w+w-1); }
          while(head<tail){
            const p=queue[head++];a[p*4+3]=0;
            if(p%w>0)add(p-1);
            if(p%w<w-1)add(p+1);
            if(p>=w)add(p-w);
            if(p<(h-1)*w)add(p+w);
          }
          g.putImageData(px,0,0);
          return out;
        }
        function trimTransparent(img) {
          const w=img.width,h=img.height;
          const g=img.getContext('2d', {willReadFrequently:true});
          const a=g.getImageData(0,0,w,h).data;
          let left=w,top=h,right=-1,bottom=-1;
          for(let y=0;y<h;y++)for(let x=0;x<w;x++){
            if(a[(y*w+x)*4+3]>12){
              if(x<left)left=x;if(x>right)right=x;
              if(y<top)top=y;if(y>bottom)bottom=y;
            }
          }
          if(right<left)return img;
          const o=document.createElement('canvas');
          o.width=right-left+1;o.height=bottom-top+1;
          const og=o.getContext('2d');og.imageSmoothingEnabled=false;
          og.drawImage(img,left,top,o.width,o.height,0,0,o.width,o.height);
          return o;
        }
        function makeFrames(sheet,count){
          const fw=Math.floor(sheet.width/count), result=[];

            o.getContext('2d').drawImage(sheet,i*fw,0,fw,sheet.height,0,0,fw,sheet.height);
            result.push(trimTransparent(o));
          }
          return result;
        }

          if(state==='forestTotemCharge'){startForestOutro();return true;}
          if(state==='forestOutro'){finishForestOutro();return true;}
          if(state==='skyIntro'){finishSkyIntro();return true;}
          if(state==='skyAltarCharge'){beginSkyScene('skyOutro');return true;}
          if(state==='skyOutro'){finishSkyOutro();return true;}
          return false;
        }

        window.addEventListener('keydown', e=>{
          if(e.code==='KeyI'){e.preventDefault();window.toggleInventario();return;}
          if(inventoryOpen){if(e.code==='Escape'){e.preventDefault();window.toggleInventario();}return;}
          if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyA','KeyD','KeyW','KeyS','Enter'].includes(e.code))e.preventDefault();
          if(state==='map'){
            if(e.repeat && (e.code==='Enter'||e.code==='Space'))return;
            if(e.code==='Enter'||e.code==='Space'){chooseMapLevel();return;}
            if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
            if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
            if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;
            if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=true;
            return;
          }
          if(state==='chapterEnd'&&(e.code==='Enter'||e.code==='Space')){returnToMap();return;}
          if(state==='title2'&&(e.code==='Enter'||e.code==='Space'||e.code==='ArrowUp')){startForest();return;}
          if(state==='title3'&&(e.code==='Enter'||e.code==='Space'||e.code==='ArrowUp')){startSkyLevel();return;}
          if(['Enter','Space','ArrowUp'].includes(e.code)&&skipStoryScene())return;
          if(state!=='playing')return;
          if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
          if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
          if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;
        });
        window.addEventListener('keyup',e=>{
          if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
          if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
          if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;
          if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false;
        });
        window.addEventListener('blur',()=>{keys.left=keys.right=keys.up=keys.down=false;});
        function bindInput(id,key){
          const el=document.getElementById(id);if(!el)return;
          const press=e=>{
            e.preventDefault();
            el.setPointerCapture?.(e.pointerId);
            if(state==='map'){
              if(id==='btn-jump'){chooseMapLevel();return;}
              keys[key]=true;return;
            }
            if(state==='chapterEnd'&&id==='btn-jump'){returnToMap();return;}
            if(state==='title2'&&key==='up'){startForest();return;}
            if(state==='title3'&&key==='up'){startSkyLevel();return;}
            if(id==='btn-jump'&&skipStoryScene())return;
            if(state!=='playing')return;
            keys[key]=true;
          };
          const release=e=>{e.preventDefault();keys[key]=false;};
          el.addEventListener('pointerdown',press);
          ['pointerup','pointercancel','lostpointercapture'].forEach(evt=>el.addEventListener(evt,release));
        }
        bindInput('btn-left','left');bindInput('btn-right','right');
        bindInput('btn-up','up');bindInput('btn-down','down');bindInput('btn-jump','up');

        function updateMovingPlatforms(t){
          // Movimento senoidal previsível. Um jogador em cima é transportado junto.
          for(const b of level===2?level2Blocks:level3Blocks){
            if(!b.moving)continue;
            const oldX=b.x,oldY=b.y;
            b.x=b.baseX+Math.sin(t*b.speed)*b.travel;
            b.y=b.baseY;
            const standing=player.vy>=0&&Math.abs((player.y+player.h)-oldY)<3&&
              player.x+player.w>oldX&&player.x<oldX+b.w;
            if(standing){player.x+=b.x-oldX;player.y+=b.y-oldY;}
          }
        }
        function hasFloorAhead(enemy,terrain){
          // Consulta a borda dianteira e 5px abaixo dos pés; não depende do tamanho dos buracos.
          // Funciona nos dois mundos e impede que o inimigo ande para o vazio.
          const nextX=enemy.x+enemy.vx;
          const footX=enemy.vx>0?nextX+enemy.w+4:nextX-4;
          const footY=enemy.y+enemy.h+5;
          return terrain.some(b=>
            (b.type==='ground'||b.type==='forestGround'||b.type==='pipe'||
             b.type==='brick'||b.type==='surprise'||b.type==='wood'||b.type==='magic') &&
            footX>=b.x && footX<b.x+b.w &&
            footY>=b.y && footY<b.y+b.h
          );
        }
        function updateEnemies(){
          const terrain=activeBlocks();
          for(const enemy of enemies){
            if(!enemy.alive)continue;
            const oldBottom=enemy.y+enemy.h;
            enemy.y+=4;
            let grounded=false;
            for(const b of terrain){
              if(isColliding(enemy,b)&&oldBottom<=b.y+3){
                enemy.y=b.y-enemy.h;
                grounded=true;
                break;
              }
            }
            let turned=false;
            // Antes da movimentação horizontal: olhar o chão *à frente*.
            // A verificação só é aplicada quando há apoio, para não oscilar enquanto cai.
            if(grounded && enemy.vx!==0 && !hasFloorAhead(enemy,terrain)){
              enemy.vx*=-1;
              turned=true;
            }
            if(!turned)enemy.x+=enemy.vx;
            for(const b of terrain){
              if(b.type!=='ground'&&b.type!=='forestGround'&&isColliding(enemy,b)){
                if(enemy.vx<0)enemy.x=b.x+b.w;
                else enemy.x=b.x-enemy.w;
                enemy.vx*=-1;
                break;
              }
            }
            if(invulnerable<=0&&isColliding(player,enemy)){
              if(player.vy>0&&player.y+player.h<=enemy.y+20){
                enemy.alive=false;player.vy=player.jumpPower*0.8;score+=100;setHUD();
              } else {loseLife();return;}
            }
          }
        }
        function updateSkyBirds(t){
          for(const bird of skyBirds){
            if(!bird.alive)continue;
            bird.x+=bird.vx;
            if(bird.x<bird.baseX-bird.range||bird.x>bird.baseX+bird.range){
              bird.vx*=-1;
              bird.x=Math.max(bird.baseX-bird.range,Math.min(bird.baseX+bird.range,bird.x));
            }
            bird.y=bird.baseY+Math.sin(t*2.5+bird.phase)*24;
            if(invulnerable<=0&&isColliding(player,bird)){
              if(player.vy>0&&player.y+player.h<bird.y+18){
                bird.alive=false;player.vy=player.jumpPower*.72;score+=150;setHUD();
              }else{loseLife();return;}
            }
          }
        }
        function update(dt,now){
          document.body.classList.toggle('map-mode',state==='map');
          if(!sceneReady||inventoryOpen)return;
          if(state==='map'){updateMap(dt);return;}
          if(state==='cutscene'){
            cinematicSeconds=(now-cutsceneStart)/1000;
            if(cinematicSeconds>=10.1){levelComplete[1]=true;returnToMap();}
            return;
          }
          if(state==='forestTotemCharge'){
            // Permite ver o sprite 56.png aceso antes de começar a cena final.
            if(now-forestTotemActivatedAt>=FOREST_TOTEM_CHARGE_MS)startForestOutro();
            return;
          }
          if(state==='skyAltarCharge'){
            if(now-skyAltarActivatedAt>=SKY_ALTAR_CHARGE_MS)beginSkyScene('skyOutro');
            return;
          }
          if(state==='skyIntro'||state==='skyOutro'){
            skySceneSeconds=(now-skySceneStart)/1000;
            if(state==='skyIntro'&&skySceneSeconds>=skyDialogueDuration())finishSkyIntro();
            else if(state==='skyOutro'){
              updateSkyOutroFacing();
              if(skySceneSeconds>=skyDialogueDuration()+SKY_OUTRO_POSTSCENE_MS/1000)finishSkyOutro();
            }
            return;
          }
          if(state==='forestIntro'||state==='forestOutro'){
            forestSceneSeconds=(now-forestSceneStart)/1000;
            if(state==='forestIntro'&&forestSceneSeconds>=12.7)finishForestIntro();
            else if(state==='forestOutro'){
              // Gabriel caminha até a pista após a fuga do vilão.
              const walk=easeOut((forestSceneSeconds-11.25)/3.6);
              player.x=FOREST_END-455+(FOREST_CLUE_X-24-(FOREST_END-455))*walk;
              if(forestSceneSeconds>=15.0)giveVillainMedallion();
              if(forestSceneSeconds>=FOREST_OUTRO_DURATION)finishForestOutro();
            }
            return;
          }
          if(state!=='playing')return;
          elapsedSeconds+=dt;
          invulnerable=Math.max(0,invulnerable-dt);
          if(keys.left){player.vx=-player.speed;player.direction=-1;}
          else if(keys.right){player.vx=player.speed;player.direction=1;}
          else player.vx=0;
          // Ventos atuam somente dentro da faixa visível da rajada.
          if(level===3){
            for(const gust of skyWindZones){
              const inWind=player.x+player.w>gust.x&&player.x<gust.x+gust.w&&
                player.y+player.h>gust.y&&player.y<gust.y+gust.h;
              if(inWind&&gust.type==='horizontal')player.vx+=gust.force;
            }
            player.vx=Math.max(-7,Math.min(7,player.vx));
          }
          if(keys.up&&player.grounded){player.vy=player.jumpPower;player.grounded=false;}
          if(level===2||level===3)updateMovingPlatforms(elapsedSeconds);
          const terrain=activeBlocks();
          player.vy=Math.min(player.vy+player.gravity,16);
          if(level===3&&!player.grounded){
            for(const gust of skyWindZones){
              if(gust.type==='up'&&player.x+player.w>gust.x&&player.x<gust.x+gust.w&&
                 player.y+player.h>gust.y&&player.y<gust.y+gust.h){
                player.vy=Math.max(-16,player.vy-gust.lift);
              }
            }
          }
          player.grounded=false;
          player.x+=player.vx;
          if(player.x<0)player.x=0;
          for(const b of terrain){
            if(b.type==='skyPlatform')continue;
            if(isColliding(player,b)){
              if(player.vx>0)player.x=b.x-player.w;
              else if(player.vx<0)player.x=b.x+b.w;
              player.vx=0;
            }
          }
          const oldFootY=player.y+player.h;
          player.y+=player.vy;
          if(level===3&&player.y<32){player.y=32;player.vy=Math.max(player.vy,0);}
          for(const b of terrain){
            // Plataformas celestiais permitem passar por baixo e pousar por cima.
            if(b.type==='skyPlatform' && !(player.vy>=0&&oldFootY<=b.y+7))continue;
            if(isColliding(player,b)){
              if(player.vy>0){player.y=b.y-player.h;player.vy=0;player.grounded=true;}
              else if(player.vy<0){player.y=b.y+b.h;player.vy=0;}
            }
          }
          if(player.y>GAME_HEIGHT+200){loseLife();return;}
          if(level===3&&!skyCheckpointReached&&player.x+player.w>1650&&player.x<1720&&player.y+player.h>330){
            skyCheckpointReached=true;skyCheckpointX=1650;score+=250;setHUD();
          }
          if(level===2 && !checkpointReached && player.x+player.w>1760 &&
             player.x<1825 && player.y+player.h>305){
            checkpointReached=true;checkpointX=1730;score+=250;setHUD();
          }
          if(level===3)updateSkyBirds(elapsedSeconds);
          else updateEnemies();
          if(state!=='playing')return;
          if(level===1&&isColliding(player,princess)){startCutscene();return;}
          if(level===2 && player.grounded &&
             player.x+player.w>=FOREST_TOTEM_X-18 && player.x<FOREST_TOTEM_X+52){
            activateForestTotem(now);return;
          }
          if(level===3&&player.grounded&&player.x+player.w>=SKY_ALTAR_X-35&&player.x<SKY_ALTAR_X+45){
            activateSkyAltar(now);return;
          }
          const maxCamera=level===1?3250:(level===2?FOREST_END-GAME_WIDTH:SKY_END-GAME_WIDTH);
          cameraX=Math.max(0,Math.min(maxCamera,player.x-GAME_WIDTH/2.5));
          if(!player.grounded)player.animFrame=2;
          else if(player.vx!==0){player.animTimer++;
            if(player.animTimer>8){player.animFrame=player.animFrame===1?0:1;player.animTimer=0;}}
          else player.animFrame=0;
          setHUD();
        }

        function drawSpriteOnFeet(sprite,centerX,footY,height,facing=1){
          if(!sprite||!sprite.width||!sprite.height)return;
          const width=Math.max(1,Math.round(height*sprite.width/sprite.height));
          ctx.save();ctx.translate(Math.round(centerX),Math.round(footY));
          if(facing===-1)ctx.scale(-1,1);
          ctx.drawImage(sprite,-Math.round(width/2),-height,width,height);
          ctx.restore();
        }

        // Ritmo da dublagem futura: uma única lista define duração e fala ativa.
        function timedLines(list){
          let at=0;
          return list.map(item=>{
            const line={from:at,to:at+item.duration,speaker:item.speaker,message:item.message,color:item.color};
            at=line.to;return line;
          });
        }
        const SKY_INTRO_LINES=timedLines([
          {speaker:'GABRIEL',message:'ONDE A GENTE FOI PARAR?! ESTAMOS NAS NUVENS?!',duration:4.5,color:'#ffe4a0'},
          {speaker:'VITORIA',message:'GABRIEL! ESSE LUGAR É PERIGOSO! CUIDADO COM O VENTO!',duration:5.2,color:'#ffadd1'},
          {speaker:'VILÃO',message:'VOCÊ CONSEGUIU ME SEGUIR ATÉ AQUI... MAS DUVIDO QUE CONSIGA ATRAVESSAR MEU TEMPLO TALARICAR!',duration:7.2,color:'#d6a5ff'},
          {speaker:'GABRIEL',message:'VOCÊ DE NOVO?! ALÉM DE TALARICADOR, AGORA É DONO DAS NUVENS?!',duration:5.7,color:'#ffe4a0'},
          {speaker:'GABRIEL',message:'COITADO, DEVE ACHAR QUE ESTÁ VOANDO ALTO.',duration:4.4,color:'#ffe4a0'}
        ]);
        const SKY_OUTRO_LINES=timedLines([
          {speaker:'GABRIEL',message:'O CRISTAL ESTÁ ACESO! ACABOU, TALARICADOR!',duration:4.1,color:'#ffe4a0'},
          {speaker:'VITORIA',message:'GABRIEL! O TEMPLO ESTÁ TREMENDO!',duration:3.9,color:'#ffadd1'},
          {speaker:'VILÃO',message:'CADA VITÓRIA SUA ME DEIXA MAIS PERTO DO MEU PLANO...',duration:5.0,color:'#d6a5ff'},
          {speaker:'GABRIEL',message:'QUE PLANO? QUEM É VOCÊ DE VERDADE?!',duration:4.2,color:'#ffe4a0'},
          {speaker:'VILÃO',message:'VOCÊ DESCOBRIRÁ... NA PRÓXIMA FASE!',duration:4.2,color:'#d6a5ff'},
          {speaker:'VITORIA',message:'NÃO DESISTA! ESTOU CONTANDO COM VOCÊ!',duration:4.1,color:'#ffadd1'}
        ]);
        function skyDialogueLines(which=state){return which==='skyIntro'?SKY_INTRO_LINES:SKY_OUTRO_LINES;}
        function skyDialogueDuration(which=state){const lines=skyDialogueLines(which);return lines[lines.length-1].to;}
        function activeDialogueSpeaker(){
          if(state==='skyIntro'||state==='skyOutro'){
            return storyLine(skySceneSeconds,skyDialogueLines())?.speaker||null;
          }
          if(state==='forestIntro'){
            const t=forestSceneSeconds;
            return t<2.5?'VITORIA':t<6.5?'GABRIEL':t<8.5?'VILÃO':t<10.6?'VITORIA':t<12.7?'GABRIEL':null;
          }
          if(state==='forestOutro'){
            return storyLine(forestSceneSeconds,FOREST_OUTRO_LINES)?.speaker||null;
          }
          if(state==='cutscene'){
            const t=cinematicSeconds;
            return t<1.8?'GABRIEL':t<4.7?'VILÃO':t<5.5?'VITORIA':t<9.4?'GABRIEL':null;
          }
          return null;
        }

        const mouthSkinCache=new WeakMap();
        function getCharacterSkin(sprite,character){
          if(mouthSkinCache.has(sprite))return mouthSkinCache.get(sprite);
          let color=character==='GABRIEL'?'#dea078':'#efb290';
          try {
            const g=sprite.getContext?.('2d',{willReadFrequently:true});
            if(g){
              const w=sprite.width,h=sprite.height;
              const pixels=g.getImageData(0,0,w,h).data;
              const x1=Math.floor(w*(character==='GABRIEL'?.48:.31));
              const x2=Math.ceil(w*(character==='GABRIEL'?.90:.70));
              let shades=[];
              for(let y=Math.floor(h*.22);y<Math.ceil(h*.51);y++)
                for(let x=x1;x<x2;x++){
                  const i=(y*w+x)*4,r=pixels[i],green=pixels[i+1],b=pixels[i+2],a=pixels[i+3];
                  if(a>220&&r>115&&green>65&&green<213&&b<182&&r>green*1.10&&green>b*.95)
                    shades.push([r,green,b]);
                }
              if(shades.length){
                shades.sort((a,b)=>a[0]-b[0]);
                const shade=shades[Math.floor(shades.length*.58)];
                color='rgb('+shade[0]+','+shade[1]+','+shade[2]+')';
              }
            }
          }catch(e){/* Canvas com restrição: cor de pele alternativa. */}
          mouthSkinCache.set(sprite,color);return color;
        }
        function drawSpeakingSprite(sprite,centerX,footY,height,character,facing=1){
          drawSpriteOnFeet(sprite,centerX,footY,height,facing);
          if(activeDialogueSpeaker()!==character||!sprite?.width||!sprite?.height)return;
          const open=Math.floor(performance.now()/165)%2===0;
          const w=Math.max(1,Math.round(height*sprite.width/sprite.height));
          ctx.save();ctx.translate(Math.round(centerX),Math.round(footY));
          if(facing===-1)ctx.scale(-1,1);
          // Substitui TODA a região da boca já desenhada (não apenas um pixel externo).
          // Âncora interna ao rosto, com cor adaptada aos pixels de pele de cada sprite.
          const mouthX=character==='GABRIEL'?Math.round(w*.11):0;
          const mouthY=character==='GABRIEL'?-Math.round(height*.62):-Math.round(height*.64);
          ctx.fillStyle=getCharacterSkin(sprite,character);
          ctx.fillRect(mouthX-4,mouthY-3,9,7);
          ctx.fillStyle='#3c2027';
          if(open){
            ctx.fillRect(mouthX-3,mouthY-1,7,5);
            ctx.fillStyle='#fa9ba6';ctx.fillRect(mouthX-2,mouthY+2,5,1);
            ctx.fillStyle='#fff5de';ctx.fillRect(mouthX-2,mouthY-1,5,1);
          }else{
            ctx.fillRect(mouthX-3,mouthY+1,7,2);
            ctx.fillStyle='#b45a60';ctx.fillRect(mouthX-1,mouthY+2,3,1);
          }
          ctx.restore();
        }

        function drawObject(sprite,x,y,w,h){
          if(sprite&&sprite.width&&sprite.height)ctx.drawImage(sprite,Math.round(x),Math.round(y),Math.round(w),Math.round(h));
        }
        function drawOriginalGround(b){
          const img=processedAssets.ground;if(!img)return;
          const tile=32, side=Math.max(1,Math.floor(img.width*.035));
          const srcW=Math.max(1,img.width-side*2);
          const dirtY=Math.floor(img.height*.42),dirtH=Math.max(1,Math.floor(img.height*.42));
          ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();
          ctx.fillStyle='#a85a28';ctx.fillRect(b.x,b.y,b.w,b.h);
          for(let x=b.x;x<b.x+b.w;x+=tile){
            ctx.drawImage(img,side,0,srcW,img.height,x,b.y,tile,tile);
            for(let y=b.y+tile;y<b.y+b.h;y+=tile)
              ctx.drawImage(img,side,dirtY,srcW,dirtH,x,y,tile,tile);
          }
          ctx.restore();
        }
        function drawForestGround(b){
          const top=extras.forestGround,inside=extras.dirt;
          ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();
          ctx.fillStyle='#201526';ctx.fillRect(b.x,b.y,b.w,b.h);
          const tile=32;
          for(let x=b.x;x<b.x+b.w;x+=tile){
            // Usa 48.jpg para a terra interna; se nao carregar, recorta a textura do 47.png.
            for(let y=b.y+tile;y<b.y+b.h;y+=tile){
              if(inside)ctx.drawImage(inside,x,y,tile,tile);
              else if(top)ctx.drawImage(top,0,Math.floor(top.height*.48),top.width,Math.max(1,Math.floor(top.height*.40)),x,y,tile,tile);
            }
            if(top)ctx.drawImage(top,x,b.y,tile,tile);
            else {ctx.fillStyle='#234e3e';ctx.fillRect(x,b.y,tile,8);}
          }
          ctx.restore();
        }
        function drawForestBackground(){
          if(extras.sky)drawObject(extras.sky,0,0,GAME_WIDTH,GAME_HEIGHT);
          else {ctx.fillStyle='#10152f';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);}
          function layer(img,speed,y,height,alpha=1,width=900){
            if(!img)return;
            const offset=((cameraX*speed)%width+width)%width;
            ctx.save();ctx.globalAlpha=alpha;
            for(let x=-offset-width;x<GAME_WIDTH+width;x+=width)
              drawObject(img,x,y,width,height);
            ctx.restore();
          }
          layer(extras.mountains,.16,120,270,.85,1050);
          layer(extras.trees,.32,80,315,.9,950);
          // Árvores próximas, mas sempre atrás das plataformas e do jogador.
          if(extras.giantTree){
            ctx.save();ctx.globalAlpha=.77;
            for(let x=100;x<FOREST_END+700;x+=660){
              const sx=x-cameraX*.55;
              if(sx>-150&&sx<GAME_WIDTH+150)drawObject(extras.giantTree,sx,35,130,375);
            }
            ctx.restore();
          }
        }
        function drawLevelOne(){
          ctx.fillStyle='#5c94fc';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
          ctx.fillStyle='#fff';
          for(const c of clouds){
            let cx=(c.x-cameraX*.2)%(GAME_WIDTH*4);
            if(cx<-200)cx+=GAME_WIDTH*4;cx=Math.round(cx);
            ctx.fillRect(cx,c.y,c.w,c.h);
            ctx.fillRect(cx+10,c.y-10,c.w-20,c.h+20);
          }
          ctx.save();ctx.translate(-Math.round(cameraX),0);
          for(const b of level1Blocks){
            if(b.type==='ground')drawOriginalGround(b);
            else drawObject(processedAssets[b.type],b.x,b.y,b.w,b.h);
          }
          drawObject(processedAssets.castle,castle.x,castle.y,castle.w,castle.h);
          if(state==='cutscene')drawCinematicCharacters(cinematicSeconds);
          else drawSpriteOnFeet(processedAssets.princess,princess.x+princess.w/2,princess.y+princess.h,princess.h);
          drawEnemies();

        function drawEnemies(){

        function easeOut(v){const x=Math.max(0,Math.min(1,v));return 1-(1-x)*(1-x);}
        function drawCinematicCharacters(t){
          // Cinemática em ordem física correta:
          // o vilão SAI do portal à direita, vai até Vitoria à esquerda,
          // captura a princesa e volta COM ELA para a direita, entrando no portal.
          const portalC=princess.x+103, portalY=princess.y-47;
          const princessStartX=princess.x+princess.w/2;
          const princessStartFoot=princess.y+princess.h;
          const villainAtPrincess=princessStartX+28;
          const easeInOut=v=>{
            const x=Math.max(0,Math.min(1,v));
            return x*x*(3-2*x);
          };
          const portalOpen=easeOut((t-1.8)/1.1);
          const portalClose=1-easeOut((t-7.1)/1.2);
          const portalScale=Math.max(0,portalOpen*portalClose);
          if(portalScale>.005){
            ctx.save();ctx.translate(portalC,portalY+80);ctx.scale(portalScale,portalScale);
            if(extras.portal)drawObject(extras.portal,-53,-84,106,146);
            else {ctx.fillStyle='#6e29ba';ctx.beginPath();ctx.ellipse(0,0,42,67,0,0,Math.PI*2);ctx.fill();}
            ctx.restore();
          }

          // t=3.0–4.6: ele avança DA DIREITA PARA A ESQUERDA,
          // olhando na direção da princesa.
          const approach=easeInOut((t-3.0)/1.6);
          // t=4.8–5.3: ele agarra Vitoria e a ergue do chão.
          const pickup=easeInOut((t-4.8)/.5);
          // t=5.3–6.9: os dois regressam JUNTOS em direção ao portal.
          const retreat=easeInOut((t-5.3)/1.6);
          // Na entrada, os dois encolhem e somem no mesmo instante.
          const vanish=easeOut((t-6.5)/.65);
          const captiveScale=1-.58*vanish;
          const captiveAlpha=1-vanish;
          const floatY=Math.sin(t*3)*4;

          const villainX=portalC+(villainAtPrincess-portalC)*approach+
            (portalC-villainAtPrincess)*retreat;
          const villainY=portalY-17+floatY-13*retreat;
          const villainVisible=easeOut((t-3)/.5)*captiveAlpha;

          if(villainVisible>.005){
            ctx.save();ctx.globalAlpha=villainVisible;
            ctx.translate(villainX,villainY+47);
            // Aproxima-se olhando para a ESQUERDA e retorna para a DIREITA.
            // A imagem original tem a frente voltada à direita.
            ctx.scale(t<5.3?-captiveScale:captiveScale,captiveScale);
            if(extras.villain)drawObject(extras.villain,-36,-47,72,94);
            else {ctx.fillStyle='#201033';ctx.fillRect(-20,-40,40,70);}
            ctx.restore();
          }

          if(t<7.15 && captiveAlpha>.005){
            // Ela não se move sozinha ou no sentido contrário: primeiro é
            // levantada pelo vilão; depois ambos viajam para o portal.
            const capturedX=princessStartX+17;
            const princessX=princessStartX+17*pickup+
              (portalC-capturedX)*retreat;
            const princessFoot=princessStartFoot-29*pickup-15*retreat;
            ctx.save();ctx.globalAlpha=captiveAlpha;
            ctx.translate(princessX,princessFoot);
            ctx.scale(captiveScale,captiveScale);
            drawSpeakingSprite(processedAssets.princess,0,0,princess.h,'VITORIA');
            ctx.restore();
          }
        }

        // Caixa de diálogo centralizada abaixo do HUD — sem cobrir o placar em mobile.

        function drawStoryDialogue(speaker,message,color='#ffe4b5'){
          const x=65,y=112,w=670,h=104;
          ctx.save();
          ctx.fillStyle='rgba(6,10,29,.91)';ctx.fillRect(x,y,w,h);
          ctx.strokeStyle='#a891d5';ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);
          ctx.textAlign='left';ctx.textBaseline='alphabetic';
          ctx.font='11px "Press Start 2P", monospace';
          ctx.fillStyle=color;ctx.fillText(speaker+':',x+20,y+29);
          const fontSize=11;
          ctx.font=`${fontSize}px "Press Start 2P", monospace`;
          const maxWidth=w-40;
          const words=message.split(/\s+/);
          const lines=[];let line='';
          for(const word of words){
            const attempt=line?line+' '+word:word;
            if(ctx.measureText(attempt).width>maxWidth&&line){lines.push(line);line=word;}
            else line=attempt;
          }
          if(line)lines.push(line);
          ctx.fillStyle='#ffffff';
          for(let i=0;i<Math.min(2,lines.length);i++)ctx.fillText(lines[i],x+20,y+59+i*24);
          ctx.restore();

            if(!extras.skyCrow){ctx.fillStyle='#332548';ctx.fillRect(bird.x,bird.y,bird.w,bird.h);}
            ctx.restore();
          }
        }
        // Posições compartilhadas pela câmera, personagens e objeto da cena final.
        function skyEscapePosition(t){
          const intro=state==='skyIntro';
          const duration=skyDialogueDuration();
          if(intro){
            const travel=easeOut((t-(duration-5.6))/3.2);
            return {
              princessX:349+110*travel,
              villainX:470+110*travel,
              portalX:605,
              fade:1-easeOut((t-(duration-1.8))/1.7),
              floatY:Math.sin(t*3)*4,
              portalOpen:t>duration-6.5,
              travel
            };
          }
          const portalX=SKY_END-115;
          const travel=easeOut((t-SKY_ESCAPE_START)/(SKY_ESCAPE_FINISH-SKY_ESCAPE_START));
          return {
            princessX:(SKY_END-360)+(portalX-(SKY_END-360))*travel,
            villainX:(SKY_END-280)+(portalX-(SKY_END-280))*travel,
            portalX,
            fade:1-easeOut((t-(SKY_ESCAPE_FINISH-.85))/.85),
            floatY:Math.sin(t*3)*4,
            portalOpen:t>=SKY_ESCAPE_START-.45,
            travel
          };
        }
        function updateSkyOutroFacing(){
          if(state!=='skyOutro')return;
          const pose=skyEscapePosition(skySceneSeconds);
          // 1) Acompanha Vitoria e vilão; 2) observa o portal;
          // 3) segue o copo em voo e vira de lado quando o objeto passa por ele.
          const drink=getSkyDrinkPose(skySceneSeconds);
          const target=drink?drink.x:(pose.fade>.02?pose.villainX:pose.portalX);
          player.direction=target<player.x+player.w/2?-1:1;
        }
        function drawSkyStoryActors(){
          const intro=state==='skyIntro',t=skySceneSeconds;
          const pose=skyEscapePosition(t);
          const {princessX,villainX,portalX,floatY}=pose;
          if(pose.portalOpen){
            ctx.save();ctx.globalAlpha=.75*easeOut((t-(intro?skyDialogueDuration()-6.5:SKY_ESCAPE_START-.45))/1);
            if(extras.portal)drawObject(extras.portal,portalX-39,226,78,150);
            else{ctx.fillStyle='#8f73d7';ctx.fillRect(portalX-30,235,60,136);}
            ctx.restore();
          }
          if(pose.fade>.002){
            ctx.save();ctx.globalAlpha=Math.max(0,pose.fade);
            ctx.translate(princessX,358-(intro?18*pose.travel:13*pose.travel)+floatY);
            drawSpeakingSprite(processedAssets.princess,0,0,48,'VITORIA');
            ctx.restore();
            ctx.save();ctx.globalAlpha=Math.max(0,pose.fade);
            ctx.translate(villainX,372-(intro?18*pose.travel:13*pose.travel)+floatY);
            if(extras.villain)drawObject(extras.villain,-37,-108,74,108);
            else{ctx.fillStyle='#21142d';ctx.fillRect(-30,-85,60,85);}
            ctx.restore();
          }
        }
        // Trajetória revisada: o drink 67.png é ARREMESSADO pelo portal,
        // passa por cima de Gabriel, aterrissa do outro lado (à esquerda)
        // e dá uma pequena rolada antes de parar no chão seguro.
        // A pista permanece apenas visual enquanto os diálogos são decididos.
        function getSkyDrinkPose(t){
          if(state!=='skyOutro'||t<SKY_DRINK_DROP_START)return null;
          const ms=Math.max(0,(t-SKY_DRINK_DROP_START)*1000);
          const portalX=SKY_END-115;
          const landX=SKY_ALTAR_X-94;
          const stopX=SKY_ALTAR_X-132; // à ESQUERDA do Gabriel, ainda sobre chão.
          const groundFoot=379;
          if(ms<SKY_DRINK_FLIGHT_MS){
            const p=Math.min(1,ms/SKY_DRINK_FLIGHT_MS),q=1-p;
            // Curva cúbica com ápice alto: p0 no portal, p3 no chão.
            const x=portalX+(landX-portalX)*p;
            const foot=q*q*q*316+3*q*q*p*150+3*q*p*p*178+p*p*p*groundFoot;
            const angle=-Math.PI*2*p; // uma volta completa durante o voo
            return {x,foot,angle,travel:p,phase:'flight'};
          }
          const rollProgress=easeOut((ms-SKY_DRINK_FLIGHT_MS)/SKY_DRINK_ROLL_MS);
          const x=landX+(stopX-landX)*rollProgress;
          const hop=Math.sin(rollProgress*Math.PI*2.2)*8*(1-rollProgress);
          const foot=groundFoot-Math.abs(hop);
          const angle=-Math.PI*2-Math.sin(rollProgress*Math.PI)*.22;
          return {x,foot,angle,travel:rollProgress,phase:rollProgress>=1?'stopped':'roll'};
        }
        function drawSkyDrink(){
          const pose=getSkyDrinkPose(skySceneSeconds);
          if(!pose)return;
          // Discretas partículas claras reforçam a parábola, sem usar as
          // marcas de orientação do print como arte definitiva.
          if(pose.phase==='flight'){
            ctx.save();
            for(let k=1;k<=3;k++){
              const prior=getSkyDrinkPose(skySceneSeconds-k*.075);
              if(!prior)continue;
              ctx.globalAlpha=.24-k*.05;
              ctx.fillStyle='#dcf6ff';
              ctx.fillRect(Math.round(prior.x-2),Math.round(prior.foot-18),4,4);
            }
            ctx.restore();
          }
          ctx.save();
          ctx.translate(Math.round(pose.x),Math.round(pose.foot));
          ctx.rotate(pose.angle);
          if(extras.villainDrink){
            drawObject(extras.villainDrink,-21,-40,42,40);
          }else{
            // Sprite temporário para que a animação funcione antes do upload do 67.png.
            ctx.fillStyle='#d3f1ff';ctx.fillRect(-11,-29,22,24);
            ctx.fillStyle='#7d2fc6';ctx.fillRect(-9,-22,18,14);
            ctx.fillStyle='#3c2358';ctx.fillRect(-12,-31,24,4);
            ctx.fillStyle='#fff3d1';ctx.fillRect(8,-41,3,14);
          }
          ctx.restore();
        }
        function drawSkyStoryText(){
          const line=storyLine(skySceneSeconds,skyDialogueLines());
          if(line)drawStoryDialogue(line.speaker,line.message,line.color);
          pixelText('ENTER OU BOTÃO A: PULAR CENA',GAME_HEIGHT-17,7,'#e8e9fc');
        }
        function drawLevelThree(){
          // A tela treme enquanto Vitoria avisa que o templo está tremendo,
          // mas o HUD e a caixa de texto permanecem estáveis e legíveis.
          const shaking=state==='skyOutro'&&skySceneSeconds>=SKY_OUTRO_LINES[1].from&&skySceneSeconds<SKY_OUTRO_LINES[1].to;
          const tremor=shaking?Math.sin((skySceneSeconds-SKY_OUTRO_LINES[1].from)*Math.PI/(SKY_OUTRO_LINES[1].to-SKY_OUTRO_LINES[1].from)):0;
          const quakeX=shaking?Math.round(Math.sin(skySceneSeconds*73)*4*tremor):0;
          const quakeY=shaking?Math.round(Math.cos(skySceneSeconds*95)*3*tremor):0;
          ctx.save();ctx.translate(quakeX,quakeY);
          drawSkyBackground();drawSkyWind();
          ctx.save();ctx.translate(-Math.round(cameraX),0);
          for(const b of level3Blocks){
            if(b.type==='skyGround')drawSkyGround(b);
            else if(b.type==='skyPlatform'){
              if(extras.skyPlatform)drawObject(extras.skyPlatform,b.x,b.y,b.w,b.h);
              else {ctx.fillStyle='#d9bf87';ctx.fillRect(b.x,b.y,b.w,b.h);}
            }
          }
          const flag=skyCheckpointReached?extras.checkpointOn:extras.checkpointOff;
          if(flag)drawObject(flag,1657,310,40,70);
          drawSkyBirds();drawSkyAltar();
          if(state==='skyIntro'||state==='skyOutro')drawSkyStoryActors();
          if(state==='skyOutro')drawSkyDrink();
          drawHero();
          ctx.restore();
          ctx.restore();
          if(state==='skyIntro'||state==='skyOutro')drawSkyStoryText();
          if(state==='skyOutro'&&skySceneSeconds>=skyDialogueDuration()){
            pixelText('ALGO CAIU DO PORTAL...',GAME_HEIGHT-44,9,'#ffe9b0');
          }
          if(state==='skyAltarCharge'){
            ctx.fillStyle='rgba(7,32,62,.76)';ctx.fillRect(186,72,430,57);
            pixelText('ALTAR CELESTIAL ATIVADO!',106,11,'#9cf7ff');
          }
        }

        function overlay(title,detail,foot){
          ctx.fillStyle='rgba(8,4,22,.77)';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
          pixelText(title,176,20,'#f2eaff');
          pixelText(detail,215,11,'#c4a8f5');
          if(foot)pixelText(foot,260,9,'#e8e9fc');
        }
        function draw(){
          ctx.imageSmoothingEnabled=false;
          if(!sceneReady){ctx.fillStyle='#5c94fc';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);pixelText('CARREGANDO A MAGIA...',GAME_HEIGHT/2,12);return;}
          if(state==='map'){drawMap();return;}
          if(level===1)drawLevelOne();else if(level===2)drawLevelTwo();else drawLevelThree();
          if(state==='title2')overlay('FASE 2','A FLORESTA MISTERIOSA','ENTER OU BOTÃO A PARA COMEÇAR');
          if(state==='title3')overlay('FASE 3','O TEMPLO DOS VENTOS','ENTER OU BOTÃO A PARA COMEÇAR');
          if(state==='gameover')overlay('GAME OVER','AS VIDAS ACABARAM','CLIQUE EM RECOMEÇAR');
          if(state==='chapterEnd'){
            if(level===3)overlay('FASE 3 CONCLUÍDA!','O TEMPLO DOS VENTOS FOI SUPERADO.','O MISTÉRIO CONTINUA...  |  ENTER / A: MAPA');
            else overlay('FASE 2 CONCLUÍDA!','PISTA 01: MEDALHÃO RACHADO NO INVENTÁRIO','FASE 3 DISPONÍVEL  |  ENTER / A: MAPA');
          }
        }
        function loop(now){
          const dt=Math.min(.05,(now-previousFrame)/1000);
          previousFrame=now;update(dt,now);draw();requestAnimationFrame(loop);
        }
        setHUD();
        document.body.classList.add('map-mode');
        requestAnimationFrame(loop);
    </script>
</body>
</html>
