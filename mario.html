<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Super Gabriel Bros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #5c94fc; touch-action: none; font-family: 'Press Start 2P', cursive; }
        
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated; 
        }

        /* D-Pad Estilo Minimalista (Apenas Laterais) */
        .dpad-btn {
            width: 70px;
            height: 70px;
            background: #cbd5e1;
            border: 4px solid #475569;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 32px;
            color: #334155;
            box-shadow: 0 6px 0 #334155;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
        }
        .dpad-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #334155; background: #94a3b8; }

        /* Botão A (Pular) */
        .action-btn {
            width: 90px;
            height: 90px;
            background: #ef4444;
            border: 6px solid #f87171;
            border-radius: 50%;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 8px 0 #991b1b, 0 15px 25px rgba(0,0,0,0.5);
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
        }
        .action-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #991b1b, 0 5px 10px rgba(0,0,0,0.5); background: #dc2626; }

        .ui-text { text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; color: white; font-size: 14px; }
    </style>
</head>
<body>

    <div id="orientation-warning" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center text-white md:hidden portrait:flex landscape:hidden">
        <span class="text-6xl mb-4 animate-bounce">📱🔄</span>
        <h2 class="text-sm text-center px-4 leading-relaxed font-sans">Gire o celular na horizontal<br>para jogar!</h2>
    </div>

    <!-- Interface Superior (Score, Tempo, Fullscreen e Recomeçar) -->
    <div class="absolute top-4 left-4 right-4 z-50 flex justify-between items-start pointer-events-none">
        <a href="index.html" class="w-12 h-12 bg-zinc-800/80 border-2 border-white rounded-full flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg text-2xl active:scale-90 transition-transform">←</a>
        
        <div class="flex gap-6 ui-text items-center mt-2 hidden sm:flex">
            <span id="ui-score">SCORE: 0</span>
            <span id="ui-lives">🍄 x5</span>
            <span id="ui-time">⏱ 00:00:00</span>
            <span id="ui-level">FASE: 1</span>
        </div>

        <div class="flex gap-2">
            <!-- Botão de Tela Cheia -->
            <button onclick="toggleFullScreen()" class="w-12 h-12 bg-zinc-800/80 border-2 border-white rounded-xl flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg active:scale-95 transition-transform text-lg" title="Tela Cheia">
                🔲
            </button>
            <button onclick="reiniciarFase()" class="px-4 py-3 bg-zinc-800/80 border-2 border-white rounded-xl flex items-center justify-center text-white font-sans font-bold backdrop-blur pointer-events-auto shadow-lg active:scale-95 transition-transform text-sm uppercase">
                🔄 Recomeçar
            </button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- Controles Mobile -->
    <div class="fixed inset-0 pointer-events-none z-40 flex justify-between items-end pb-8 px-10 landscape:flex portrait:hidden sm:flex">
        
        <!-- Direcionais Limpos (Esquerda/Direita) -->
        <div class="flex gap-6 pointer-events-auto opacity-80 hover:opacity-100 transition-opacity items-end">
            <button id="btn-left" class="dpad-btn">◀</button>
            <button id="btn-right" class="dpad-btn">▶</button>
        </div>

        <div class="pointer-events-auto pb-4 opacity-90 hover:opacity-100 transition-opacity">
            <button id="btn-jump" class="action-btn">A</button>
        </div>
    </div>

    <script>
        // SUPER GABRIEL BROS — fase 1 preservada + aparições recorrentes do vilão e Vitoria
        // Todos os arquivos de imagem estão na RAIZ do repositório.
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 450;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        ctx.imageSmoothingEnabled = false;

        const HUD = {
          score: document.getElementById('ui-score'),
          lives: document.getElementById('ui-lives'),
          time: document.getElementById('ui-time'),
          level: document.getElementById('ui-level')
        };
        const keys = { left: false, right: false, up: false };
        let level = 1;
        let state = 'playing'; // playing | cutscene | title2 | forestIntro | forestOutro | chapterEnd | gameover
        let cutsceneStart = 0;
        let cinematicSeconds = 0;
        let forestSceneStart = 0;
        let forestSceneSeconds = 0;
        let score = 0;
        let lives = 5;
        let elapsedSeconds = 0;
        let previousFrame = performance.now();
        let cameraX = 0;
        let sceneReady = false;
        let checkpointReached = false;
        let checkpointX = 0;
        let invulnerable = 0;
        let forestPlatforms = [];
        const FOREST_END = 3400;
        const testMode = new URLSearchParams(window.location.search).get('teste');

        function toggleFullScreen() {
          const doc = document;
          if (!doc.fullscreenElement) {
            doc.documentElement.requestFullscreen?.().catch(() => {});
          } else {
            doc.exitFullscreen?.().catch(() => {});
          }
        }
        window.toggleFullScreen = toggleFullScreen;

        function setHUD() {
          HUD.score.textContent = `SCORE: ${score}`;
          HUD.lives.textContent = `🍄 x${Math.max(0, lives)}`;
          if (HUD.level) HUD.level.textContent = `FASE: ${level}`;
          const sec = Math.floor(elapsedSeconds);
          const h = String(Math.floor(sec / 3600)).padStart(2,'0');
          const m = String(Math.floor((sec % 3600) / 60)).padStart(2,'0');
          const s = String(sec % 60).padStart(2,'0');
          HUD.time.textContent = `⏱ ${h}:${m}:${s}`;
        }

        // Os sprites originais precisam do recorte do fundo verde, mas as novas
        // imagens extras usam seus formatos originais (43.jpg, 48.jpg e demais PNGs) sem chroma key.
        const assets = {};
        const processedAssets = {};
        let originalLoaded = 0;
        const originalPaths = {
          hero: '35.png', princess: '36.png', enemies: '37.jpg', castle: '38.png',
          surprise: '39.png', pipe: '40.png', brick: '41.png', ground: '42.png'
        };
        const extras = {};
        const extraPaths = {
          sky: '43.jpg', mountains: '44.png', trees: '45.png', giantTree: '46.png',
          forestGround: '47.png', dirt: '48.jpg', wood: '49.png', magic: '50.png',
          checkpointOff: '51.png', checkpointOn: '52.png', villain: '53.png', portal: '54.png'
        };

        function cropSprite(img) {
          const c=document.createElement('canvas');
          c.width=img.naturalWidth;c.height=img.naturalHeight;
          c.getContext('2d').drawImage(img,0,0);
          return trimTransparent(c);
        }
        function removeGreenScreen(img) {
          const out = document.createElement('canvas');
          out.width = img.naturalWidth; out.height = img.naturalHeight;
          const g = out.getContext('2d', { willReadFrequently: true });
          g.drawImage(img, 0, 0);
          const px = g.getImageData(0, 0, out.width, out.height);
          const a = px.data;
          const w = out.width, h = out.height;
          const seen = new Uint8Array(w*h);
          const queue = new Int32Array(w*h);
          let head = 0, tail = 0;
          function green(p) {
            const i = p*4, r = a[i], gg = a[i+1], b = a[i+2];
            return gg >= 155 && gg > r*1.65 && gg > b*1.65 && r <= 165 && b <= 165;
          }
          function add(p) { if(!seen[p]) { seen[p]=1; if(green(p)) queue[tail++]=p; } }
          for(let x=0;x<w;x++){ add(x);add((h-1)*w+x); }
          for(let y=0;y<h;y++){ add(y*w);add(y*w+w-1); }
          while(head<tail){
            const p=queue[head++];a[p*4+3]=0;
            if(p%w>0)add(p-1);
            if(p%w<w-1)add(p+1);
            if(p>=w)add(p-w);
            if(p<(h-1)*w)add(p+w);
          }
          g.putImageData(px,0,0);
          return out;
        }
        function trimTransparent(img) {
          const w=img.width,h=img.height;
          const g=img.getContext('2d', {willReadFrequently:true});
          const a=g.getImageData(0,0,w,h).data;
          let left=w,top=h,right=-1,bottom=-1;
          for(let y=0;y<h;y++)for(let x=0;x<w;x++){
            if(a[(y*w+x)*4+3]>12){
              if(x<left)left=x;if(x>right)right=x;
              if(y<top)top=y;if(y>bottom)bottom=y;
            }
          }
          if(right<left)return img;
          const o=document.createElement('canvas');
          o.width=right-left+1;o.height=bottom-top+1;
          const og=o.getContext('2d');og.imageSmoothingEnabled=false;
          og.drawImage(img,left,top,o.width,o.height,0,0,o.width,o.height);
          return o;
        }
        function makeFrames(sheet,count){
          const fw=Math.floor(sheet.width/count), result=[];
          for(let i=0;i<count;i++){
            const o=document.createElement('canvas');o.width=fw;o.height=sheet.height;
            o.getContext('2d').drawImage(sheet,i*fw,0,fw,sheet.height,0,0,fw,sheet.height);
            result.push(trimTransparent(o));
          }
          return result;
        }
        Object.entries(originalPaths).forEach(([key,path])=>{
          const img=new Image();assets[key]=img;
          img.onload=()=>{
            try {
              const clean=removeGreenScreen(img);
              if(key==='hero')processedAssets.heroFrames=makeFrames(clean,4);
              else if(key==='enemies')processedAssets.enemyFrames=makeFrames(clean,2);
              else processedAssets[key]=trimTransparent(clean);
              originalLoaded++;
              if(originalLoaded===Object.keys(originalPaths).length){
                sceneReady=true; previousFrame=performance.now();
                // Testes opcionais: ?teste=final, ?teste=floresta, ?teste=intro2, ?teste=final2
                if(testMode==='final'){
                  player.x=princess.x-40; player.y=340; player.grounded=true;
                  cameraX=Math.max(0,princess.x-390); startCutscene();
                } else if(testMode==='floresta'){showForestTitle();}
                else if(testMode==='intro2'){showForestTitle();startForest();}
                else if(testMode==='final2'){showForestTitle();startForest();beginForestScene('forestOutro');}
              }
            } catch(e){ console.error('Erro processando '+path,e); }
          };
          img.onerror=()=>console.error('Arquivo original ausente: '+path);
          img.src=path;
        });
        Object.entries(extraPaths).forEach(([key,path])=>{
          const img=new Image();
          extras[key]=null;
          img.onload=()=>{extras[key]=(['sky','mountains','trees'].includes(key)?img:cropSprite(img));};
          img.onerror=()=>{ if(key!=='dirt')console.warn('Não foi possível carregar '+path); };
          img.src=path;
        });

        const player={x:50,y:100,w:24,h:40,vx:0,vy:0,speed:5.5,jumpPower:-13,gravity:0.6,grounded:false,direction:1,animFrame:0,animTimer:0};
        const princess={x:3400,y:332,w:32,h:48};
        const castle={x:3450,y:180,w:200,h:200};
        const clouds=[
          {x:100,y:50,w:60,h:20},{x:400,y:80,w:80,h:25},{x:800,y:40,w:70,h:20},
          {x:1200,y:70,w:90,h:30},{x:1600,y:50,w:60,h:20},{x:2000,y:80,w:80,h:25},
          {x:2500,y:40,w:70,h:20},{x:2900,y:70,w:90,h:30}
        ];
        // Layout da FASE 1 mantido, incluindo os mesmos buracos e obstáculos.
        const level1Blocks=[
          {x:0,y:380,w:1200,h:150,type:'ground'},
          {x:1300,y:380,w:800,h:150,type:'ground'},
          {x:2250,y:380,w:1800,h:150,type:'ground'},
          {x:400,y:300,w:60,h:80,type:'pipe'},
          {x:750,y:260,w:60,h:120,type:'pipe'},
          {x:950,y:260,w:60,h:120,type:'pipe'},
          {x:250,y:220,w:48,h:48,type:'surprise'},
          {x:500,y:220,w:48,h:48,type:'brick'},
          {x:548,y:220,w:48,h:48,type:'surprise'},
          {x:596,y:220,w:48,h:48,type:'brick'},
          {x:2900,y:332,w:48,h:48,type:'brick'},
          {x:2948,y:284,w:48,h:96,type:'brick'},
          {x:2996,y:236,w:48,h:144,type:'brick'},
          {x:3044,y:188,w:48,h:192,type:'brick'}
        ];
        const level1EnemyTemplate=[
          {x:600,y:348,w:32,h:32,vx:-1.5,type:'mushroom',alive:true},
          {x:1200,y:348,w:32,h:32,vx:-1.5,type:'mushroom',alive:true},
          {x:1800,y:348,w:32,h:32,vx:-2,type:'turtle',alive:true},
          {x:2200,y:348,w:32,h:32,vx:-2,type:'turtle',alive:true}
        ];
        const level2Blocks=[
          {x:0,y:380,w:550,h:160,type:'forestGround'},
          {x:675,y:380,w:640,h:160,type:'forestGround'},
          {x:1450,y:380,w:720,h:160,type:'forestGround'},
          {x:2320,y:380,w:1080,h:160,type:'forestGround'},
          {x:445,y:316,w:118,h:24,type:'wood'},
          {x:585,y:278,w:110,h:24,type:'wood'},
          {x:850,y:315,w:130,h:24,type:'wood'},
          {x:1100,y:299,w:118,h:24,type:'wood'},
          {x:1242,y:253,w:125,h:24,type:'magic',moving:true,baseX:1242,baseY:253,travel:70,speed:1.1},
          {x:1480,y:320,w:115,h:24,type:'wood'},
          {x:1650,y:278,w:125,h:24,type:'wood'},
          {x:1870,y:310,w:120,h:24,type:'magic',moving:true,baseX:1870,baseY:310,travel:65,speed:1.45},
          {x:2090,y:250,w:115,h:24,type:'wood'},
          {x:2210,y:297,w:130,h:24,type:'wood'},
          {x:2570,y:305,w:150,h:24,type:'wood'},
          {x:2910,y:280,w:120,h:24,type:'magic',moving:true,baseX:2910,baseY:280,travel:54,speed:1.2}
        ];
        const level2EnemyTemplate=[
          {x:790,y:348,w:32,h:32,vx:-1.6,type:'mushroom',alive:true},
          {x:1010,y:348,w:32,h:32,vx:1.6,type:'turtle',alive:true},
          {x:1590,y:348,w:32,h:32,vx:-1.8,type:'mushroom',alive:true},
          {x:1810,y:348,w:32,h:32,vx:1.6,type:'turtle',alive:true},
          {x:2490,y:348,w:32,h:32,vx:-1.9,type:'mushroom',alive:true},
          {x:3050,y:348,w:32,h:32,vx:-2,type:'turtle',alive:true}
        ];
        let enemies=level1EnemyTemplate.map(e=>({...e}));
        function activeBlocks(){return level===1?level1Blocks:level2Blocks;}
        function isColliding(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

        function resetPosition(){
          player.x=level===1?50:(checkpointReached?checkpointX:50);
          player.y=100;player.vx=0;player.vy=0;player.grounded=false;
          player.direction=1;player.animFrame=0;cameraX=0;
          if(level===2&&checkpointReached)cameraX=Math.max(0,Math.min(FOREST_END-GAME_WIDTH,player.x-320));
        }
        function restartCurrentLevel() {
          state='playing';lives=5;score=0;elapsedSeconds=0;invulnerable=0;
          checkpointReached=false;checkpointX=0;
          enemies=(level===1?level1EnemyTemplate:level2EnemyTemplate).map(e=>({...e}));
          for(const b of level2Blocks)if(b.moving){b.x=b.baseX;b.y=b.baseY;}
          resetPosition();setHUD();
        }
        window.reiniciarFase=restartCurrentLevel;
        function loseLife(){
          if(state!=='playing')return;
          lives--;
          if(lives<=0){state='gameover';setHUD();return;}
          enemies=(level===1?level1EnemyTemplate:level2EnemyTemplate).map(e=>({...e}));
          resetPosition();invulnerable=1.5;setHUD();
        }
        function startCutscene(){
          if(state!=='playing'||level!==1)return;
          state='cutscene';cutsceneStart=performance.now();cinematicSeconds=0;
          player.vx=0;player.vy=0;keys.left=false;keys.right=false;keys.up=false;
          player.direction=1;player.animFrame=0;
        }
        function showForestTitle(){
          level=2;state='title2';cameraX=0;
          keys.left=keys.right=keys.up=false;
          setHUD();
        }
        // Cada fase terá uma aparição de Vitoria e do vilão no começo e no fim.
        // As cenas nunca alteram pontuação, vidas ou checkpoint.
        function startForest(){
          if(state!=='title2')return;
          level=2;checkpointReached=false;checkpointX=0;
          enemies=level2EnemyTemplate.map(e=>({...e}));
          resetPosition();
          player.x=105;player.y=340;player.grounded=true;
          cameraX=0;
          beginForestScene('forestIntro');setHUD();
        }
        function beginForestScene(which){
          state=which;forestSceneStart=performance.now();forestSceneSeconds=0;
          keys.left=keys.right=keys.up=false;
          player.vx=0;player.vy=0;player.direction=1;player.animFrame=0;
          // No capítulo final, mantém Gabriel em uma posição visível no enquadramento.
          if(which==='forestOutro'){
            player.x=FOREST_END-455;player.y=340;player.grounded=true;
            cameraX=FOREST_END-GAME_WIDTH;
          }
        }
        function finishForestIntro(){
          if(state!=='forestIntro')return;
          state='playing';keys.left=keys.right=keys.up=false;
          player.y=340;player.grounded=true;player.vy=0;
        }
        function startForestOutro(){
          if(level!==2||state!=='playing')return;
          beginForestScene('forestOutro');
        }
        function finishForestOutro(){
          if(state!=='forestOutro')return;
          state='chapterEnd';keys.left=keys.right=keys.up=false;
        }
        function skipStoryScene(){
          if(state==='cutscene'){showForestTitle();return true;}
          if(state==='forestIntro'){finishForestIntro();return true;}
          if(state==='forestOutro'){finishForestOutro();return true;}
          return false;
        }

        window.addEventListener('keydown', e=>{
          if(['Space','ArrowUp','ArrowLeft','ArrowRight','KeyA','KeyD','KeyW','Enter'].includes(e.code))e.preventDefault();
          if(state==='title2'&&(e.code==='Enter'||e.code==='Space'||e.code==='ArrowUp')){startForest();return;}
          if(['Enter','Space','ArrowUp'].includes(e.code)&&skipStoryScene())return;
          if(state!=='playing')return;
          if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
          if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
          if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;
        });
        window.addEventListener('keyup',e=>{
          if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
          if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
          if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;
        });
        window.addEventListener('blur',()=>{keys.left=keys.right=keys.up=false;});
        function bindInput(id,key){
          const el=document.getElementById(id);if(!el)return;
          const press=e=>{
            e.preventDefault();
            if(state==='title2'&&key==='up'){startForest();return;}
            if(key==='up'&&skipStoryScene())return;
            if(state!=='playing')return;
            keys[key]=true;
          };
          const release=e=>{e.preventDefault();keys[key]=false;};
          el.addEventListener('pointerdown',press);
          ['pointerup','pointercancel','pointerleave'].forEach(evt=>el.addEventListener(evt,release));
        }
        bindInput('btn-left','left');bindInput('btn-right','right');bindInput('btn-jump','up');

        function updateMovingPlatforms(t){
          // Movimento senoidal previsível. Um jogador em cima é transportado junto.
          for(const b of level2Blocks){
            if(!b.moving)continue;
            const oldX=b.x,oldY=b.y;
            b.x=b.baseX+Math.sin(t*b.speed)*b.travel;
            b.y=b.baseY;
            const standing=player.vy>=0&&Math.abs((player.y+player.h)-oldY)<3&&
              player.x+player.w>oldX&&player.x<oldX+b.w;
            if(standing){player.x+=b.x-oldX;player.y+=b.y-oldY;}
          }
        }
        function updateEnemies(){
          const terrain=activeBlocks();
          for(const enemy of enemies){
            if(!enemy.alive)continue;
            // A gravidade dos inimigos cai sobre blocos mas nunca sobe neles por baixo.
            const oldBottom=enemy.y+enemy.h;
            enemy.y+=4;
            for(const b of terrain){
              if(enemy.vx!==0&&isColliding(enemy,b)&&oldBottom<=b.y+3){enemy.y=b.y-enemy.h;break;}
            }
            const nextX=enemy.x+enemy.vx;
            let turned=false;
            if(level===2){
              const nextFootX=nextX+(enemy.vx<0?0:enemy.w);
              const ahead=terrain.some(b=>b.type==='forestGround'&&nextFootX>b.x&&nextFootX<b.x+b.w&&Math.abs((enemy.y+enemy.h)-b.y)<6);
              if(!ahead){enemy.vx*=-1;turned=true;}
            }
            if(!turned)enemy.x+=enemy.vx;
            for(const b of terrain){
              if(b.type!=='ground'&&b.type!=='forestGround'&&isColliding(enemy,b)){
                if(enemy.vx<0)enemy.x=b.x+b.w;
                else enemy.x=b.x-enemy.w;
                enemy.vx*=-1;break;
              }
            }
            if(invulnerable<=0&&isColliding(player,enemy)){
              if(player.vy>0&&player.y+player.h<=enemy.y+20){
                enemy.alive=false;player.vy=player.jumpPower*0.8;score+=100;setHUD();
              } else {loseLife();return;}
            }
          }
        }
        function update(dt,now){
          if(!sceneReady)return;
          if(state==='cutscene'){
            cinematicSeconds=(now-cutsceneStart)/1000;
            if(cinematicSeconds>=10.1)showForestTitle();
            return;
          }
          if(state==='forestIntro'||state==='forestOutro'){
            forestSceneSeconds=(now-forestSceneStart)/1000;
            if(state==='forestIntro'&&forestSceneSeconds>=12.7)finishForestIntro();
            else if(state==='forestOutro'&&forestSceneSeconds>=11.3)finishForestOutro();
            return;
          }
          if(state!=='playing')return;
          elapsedSeconds+=dt;
          invulnerable=Math.max(0,invulnerable-dt);
          if(keys.left){player.vx=-player.speed;player.direction=-1;}
          else if(keys.right){player.vx=player.speed;player.direction=1;}
          else player.vx=0;
          if(keys.up&&player.grounded){player.vy=player.jumpPower;player.grounded=false;}
          if(level===2)updateMovingPlatforms(elapsedSeconds);
          const terrain=activeBlocks();
          player.vy=Math.min(player.vy+player.gravity,16);
          player.grounded=false;
          player.x+=player.vx;
          if(player.x<0)player.x=0;
          for(const b of terrain){
            if(isColliding(player,b)){
              if(player.vx>0)player.x=b.x-player.w;
              else if(player.vx<0)player.x=b.x+b.w;
              player.vx=0;
            }
          }
          player.y+=player.vy;
          for(const b of terrain){
            if(isColliding(player,b)){
              if(player.vy>0){player.y=b.y-player.h;player.vy=0;player.grounded=true;}
              else if(player.vy<0){player.y=b.y+b.h;player.vy=0;}
            }
          }
          if(player.y>GAME_HEIGHT+200){loseLife();return;}
          if(level===2 && !checkpointReached && player.x+player.w>1760 &&
             player.x<1825 && player.y+player.h>305){
            checkpointReached=true;checkpointX=1730;score+=250;setHUD();
          }
          updateEnemies();
          if(state!=='playing')return;
          if(level===1&&isColliding(player,princess)){startCutscene();return;}
          if(level===2 && player.x>=FOREST_END-455){startForestOutro();return;}
          const maxCamera=level===1?3250:FOREST_END-GAME_WIDTH;
          cameraX=Math.max(0,Math.min(maxCamera,player.x-GAME_WIDTH/2.5));
          if(!player.grounded)player.animFrame=2;
          else if(player.vx!==0){player.animTimer++;
            if(player.animTimer>8){player.animFrame=player.animFrame===1?0:1;player.animTimer=0;}}
          else player.animFrame=0;
          setHUD();
        }

        function drawSpriteOnFeet(sprite,centerX,footY,height,facing=1){
          if(!sprite||!sprite.width||!sprite.height)return;
          const width=Math.max(1,Math.round(height*sprite.width/sprite.height));
          ctx.save();ctx.translate(Math.round(centerX),Math.round(footY));
          if(facing===-1)ctx.scale(-1,1);
          ctx.drawImage(sprite,-Math.round(width/2),-height,width,height);
          ctx.restore();
        }
        function drawObject(sprite,x,y,w,h){
          if(sprite&&sprite.width&&sprite.height)ctx.drawImage(sprite,Math.round(x),Math.round(y),Math.round(w),Math.round(h));
        }
        function drawOriginalGround(b){
          const img=processedAssets.ground;if(!img)return;
          const tile=32, side=Math.max(1,Math.floor(img.width*.035));
          const srcW=Math.max(1,img.width-side*2);
          const dirtY=Math.floor(img.height*.42),dirtH=Math.max(1,Math.floor(img.height*.42));
          ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();
          ctx.fillStyle='#a85a28';ctx.fillRect(b.x,b.y,b.w,b.h);
          for(let x=b.x;x<b.x+b.w;x+=tile){
            ctx.drawImage(img,side,0,srcW,img.height,x,b.y,tile,tile);
            for(let y=b.y+tile;y<b.y+b.h;y+=tile)
              ctx.drawImage(img,side,dirtY,srcW,dirtH,x,y,tile,tile);
          }
          ctx.restore();
        }
        function drawForestGround(b){
          const top=extras.forestGround,inside=extras.dirt;
          ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();
          ctx.fillStyle='#201526';ctx.fillRect(b.x,b.y,b.w,b.h);
          const tile=32;
          for(let x=b.x;x<b.x+b.w;x+=tile){
            // Usa 48.jpg para a terra interna; se nao carregar, recorta a textura do 47.png.
            for(let y=b.y+tile;y<b.y+b.h;y+=tile){
              if(inside)ctx.drawImage(inside,x,y,tile,tile);
              else if(top)ctx.drawImage(top,0,Math.floor(top.height*.48),top.width,Math.max(1,Math.floor(top.height*.40)),x,y,tile,tile);
            }
            if(top)ctx.drawImage(top,x,b.y,tile,tile);
            else {ctx.fillStyle='#234e3e';ctx.fillRect(x,b.y,tile,8);}
          }
          ctx.restore();
        }
        function drawForestBackground(){
          if(extras.sky)drawObject(extras.sky,0,0,GAME_WIDTH,GAME_HEIGHT);
          else {ctx.fillStyle='#10152f';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);}
          function layer(img,speed,y,height,alpha=1,width=900){
            if(!img)return;
            const offset=((cameraX*speed)%width+width)%width;
            ctx.save();ctx.globalAlpha=alpha;
            for(let x=-offset-width;x<GAME_WIDTH+width;x+=width)
              drawObject(img,x,y,width,height);
            ctx.restore();
          }
          layer(extras.mountains,.16,120,270,.85,1050);
          layer(extras.trees,.32,80,315,.9,950);
          // Árvores próximas, mas sempre atrás das plataformas e do jogador.
          if(extras.giantTree){
            ctx.save();ctx.globalAlpha=.77;
            for(let x=100;x<FOREST_END+700;x+=660){
              const sx=x-cameraX*.55;
              if(sx>-150&&sx<GAME_WIDTH+150)drawObject(extras.giantTree,sx,35,130,375);
            }
            ctx.restore();
          }
        }
        function drawLevelOne(){
          ctx.fillStyle='#5c94fc';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
          ctx.fillStyle='#fff';
          for(const c of clouds){
            let cx=(c.x-cameraX*.2)%(GAME_WIDTH*4);
            if(cx<-200)cx+=GAME_WIDTH*4;cx=Math.round(cx);
            ctx.fillRect(cx,c.y,c.w,c.h);
            ctx.fillRect(cx+10,c.y-10,c.w-20,c.h+20);
          }
          ctx.save();ctx.translate(-Math.round(cameraX),0);
          for(const b of level1Blocks){
            if(b.type==='ground')drawOriginalGround(b);
            else drawObject(processedAssets[b.type],b.x,b.y,b.w,b.h);
          }
          drawObject(processedAssets.castle,castle.x,castle.y,castle.w,castle.h);
          if(state==='cutscene')drawCinematicCharacters(cinematicSeconds);
          else drawSpriteOnFeet(processedAssets.princess,princess.x+princess.w/2,princess.y+princess.h,princess.h);
          drawEnemies();
          drawHero();
          ctx.restore();
          if(state==='cutscene')drawCinematicText(cinematicSeconds);
        }
        function drawEnemies(){
          for(const e of enemies){if(!e.alive)continue;
            const frame=processedAssets.enemyFrames?.[e.type==='mushroom'?0:1];
            // Ambos os sprites da folha 37.jpg olham para a direita na imagem original.
            // A direção visual deve acompanhar vx, evitando o 'moonwalk' da tartaruga.
            const facing=e.vx<0?-1:1;
            drawSpriteOnFeet(frame,e.x+e.w/2,e.y+e.h,e.h,facing);
          }
        }
        function drawHero(){
          if(invulnerable>0 && Math.floor(elapsedSeconds*12)%2===0)return;
          const sprite=processedAssets.heroFrames?.[Math.min(3,player.animFrame)]||processedAssets.heroFrames?.[0];
          drawSpriteOnFeet(sprite,player.x+player.w/2,player.y+player.h,player.h,player.direction);
        }
        function easeOut(v){const x=Math.max(0,Math.min(1,v));return 1-(1-x)*(1-x);}
        function drawCinematicCharacters(t){
          // Cinemática em ordem física correta:
          // o vilão SAI do portal à direita, vai até Vitoria à esquerda,
          // captura a princesa e volta COM ELA para a direita, entrando no portal.
          const portalC=princess.x+103, portalY=princess.y-47;
          const princessStartX=princess.x+princess.w/2;
          const princessStartFoot=princess.y+princess.h;
          const villainAtPrincess=princessStartX+28;
          const easeInOut=v=>{
            const x=Math.max(0,Math.min(1,v));
            return x*x*(3-2*x);
          };
          const portalOpen=easeOut((t-1.8)/1.1);
          const portalClose=1-easeOut((t-7.1)/1.2);
          const portalScale=Math.max(0,portalOpen*portalClose);
          if(portalScale>.005){
            ctx.save();ctx.translate(portalC,portalY+80);ctx.scale(portalScale,portalScale);
            if(extras.portal)drawObject(extras.portal,-53,-84,106,146);
            else {ctx.fillStyle='#6e29ba';ctx.beginPath();ctx.ellipse(0,0,42,67,0,0,Math.PI*2);ctx.fill();}
            ctx.restore();
          }

          // t=3.0–4.6: ele avança DA DIREITA PARA A ESQUERDA,
          // olhando na direção da princesa.
          const approach=easeInOut((t-3.0)/1.6);
          // t=4.8–5.3: ele agarra Vitoria e a ergue do chão.
          const pickup=easeInOut((t-4.8)/.5);
          // t=5.3–6.9: os dois regressam JUNTOS em direção ao portal.
          const retreat=easeInOut((t-5.3)/1.6);
          // Na entrada, os dois encolhem e somem no mesmo instante.
          const vanish=easeOut((t-6.5)/.65);
          const captiveScale=1-.58*vanish;
          const captiveAlpha=1-vanish;
          const floatY=Math.sin(t*3)*4;

          const villainX=portalC+(villainAtPrincess-portalC)*approach+
            (portalC-villainAtPrincess)*retreat;
          const villainY=portalY-17+floatY-13*retreat;
          const villainVisible=easeOut((t-3)/.5)*captiveAlpha;

          if(villainVisible>.005){
            ctx.save();ctx.globalAlpha=villainVisible;
            ctx.translate(villainX,villainY+47);
            // Aproxima-se olhando para a ESQUERDA e retorna para a DIREITA.
            // A imagem original tem a frente voltada à direita.
            ctx.scale(t<5.3?-captiveScale:captiveScale,captiveScale);
            if(extras.villain)drawObject(extras.villain,-36,-47,72,94);
            else {ctx.fillStyle='#201033';ctx.fillRect(-20,-40,40,70);}
            ctx.restore();
          }

          if(t<7.15 && captiveAlpha>.005){
            // Ela não se move sozinha ou no sentido contrário: primeiro é
            // levantada pelo vilão; depois ambos viajam para o portal.
            const capturedX=princessStartX+17;
            const princessX=princessStartX+17*pickup+
              (portalC-capturedX)*retreat;
            const princessFoot=princessStartFoot-29*pickup-15*retreat;
            ctx.save();ctx.globalAlpha=captiveAlpha;
            ctx.translate(princessX,princessFoot);
            ctx.scale(captiveScale,captiveScale);
            drawSpriteOnFeet(processedAssets.princess,0,0,princess.h);
            ctx.restore();
          }
        }
        function pixelText(text,y,size=12,color='#fff'){
          ctx.textAlign='center';ctx.font=`${size}px "Press Start 2P", monospace`;
          ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillText(text,GAME_WIDTH/2+2,y+2);
          ctx.fillStyle=color;ctx.fillText(text,GAME_WIDTH/2,y);
        }
        // Caixa de diálogo centralizada abaixo do HUD — sem cobrir o placar em mobile.
        // O texto quebra automaticamente em até duas linhas, sem sair do canvas.
        function drawStoryDialogue(speaker,message,color='#ffe4b5'){
          const x=65,y=112,w=670,h=104;
          ctx.save();
          ctx.fillStyle='rgba(6,10,29,.91)';ctx.fillRect(x,y,w,h);
          ctx.strokeStyle='#a891d5';ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);
          ctx.textAlign='left';ctx.textBaseline='alphabetic';
          ctx.font='11px "Press Start 2P", monospace';
          ctx.fillStyle=color;ctx.fillText(speaker+':',x+20,y+29);
          const fontSize=11;
          ctx.font=`${fontSize}px "Press Start 2P", monospace`;
          const maxWidth=w-40;
          const words=message.split(/\s+/);
          const lines=[];let line='';
          for(const word of words){
            const attempt=line?line+' '+word:word;
            if(ctx.measureText(attempt).width>maxWidth&&line){lines.push(line);line=word;}
            else line=attempt;
          }
          if(line)lines.push(line);
          ctx.fillStyle='#ffffff';
          for(let i=0;i<Math.min(2,lines.length);i++)ctx.fillText(lines[i],x+20,y+59+i*24);
          ctx.restore();
        }
        function storyLine(t,lines){
          return lines.find(line=>t>=line.from&&t<line.to);
        }
        function drawCinematicText(t){
          if(t>1.6&&t<9.5){
            ctx.fillStyle=`rgba(8,0,28,${Math.min(.36,(t-1.6)*.14)})`;
            ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
          }
          const line=storyLine(t,[
            {from:0,to:1.8,speaker:'GABRIEL',message:'VITORIA! FINALMENTE!',color:'#ffe4a0'},
            {from:2.0,to:4.6,speaker:'GABRIEL',message:'O QUE É AQUILO?!',color:'#ffe4a0'},
            {from:4.7,to:5.5,speaker:'VITORIA',message:'GABRIEL! ME AJUDA!',color:'#ffadd1'},
            {from:5.5,to:7.2,speaker:'GABRIEL',message:'NÃO! VITORIA!',color:'#ffe4a0'},
            {from:7.2,to:9.4,speaker:'GABRIEL',message:'EU VOU TE ENCONTRAR!',color:'#ffe4a0'}
          ]);
          if(line)drawStoryDialogue(line.speaker,line.message,line.color);
          if(t>=8.9){ctx.fillStyle=`rgba(0,0,0,${Math.min(1,(t-8.9)/1.1)})`;ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);}
          if(t<9.0)pixelText('ENTER OU BOTÃO A: PULAR CENA',GAME_HEIGHT-17,7,'#bdc8d8');
        }
        // Encontros recorrentes com Vitoria e o vilão: no início e no final de cada capítulo.
        function drawForestStoryActors(){
          const intro=state==='forestIntro';
          const t=forestSceneSeconds;
          const portalX=intro?555:FOREST_END-90;
          const villainHomeX=intro?412:FOREST_END-242;
          const princessHomeX=intro?357:FOREST_END-305;
          const escapeStart=intro?7.5:6.9;
          const escapeEnd=intro?10.4:9.8;
          const progress=Math.max(0,Math.min(1,(t-escapeStart)/(escapeEnd-escapeStart)));
          const slide=progress*progress*(3-2*progress);
          const fade=1-easeOut((t-(intro?9.8:9.3))/1.0);
          const alpha=Math.max(0,fade);
          const portalOpen=easeOut((t-(intro?5.7:5.0))/.85);
          const portalClose=1-easeOut((t-(intro?10.7:10.1))/.9);
          const portalScale=Math.max(0,portalOpen*portalClose);
          if(portalScale>.005){
            ctx.save();ctx.translate(portalX,380);ctx.scale(portalScale,portalScale);
            if(extras.portal)drawObject(extras.portal,-55,-155,110,155);
            else {ctx.fillStyle='#6d37bc';ctx.beginPath();ctx.ellipse(0,-79,47,76,0,0,Math.PI*2);ctx.fill();}
            ctx.restore();
          }
          if(alpha<=.005)return;
          const villainX=villainHomeX+(portalX-villainHomeX)*slide;
          const princessX=princessHomeX+(portalX-princessHomeX-13)*slide;
          const shrink=1-.48*easeOut((t-(intro?9.5:9.0))/1.1);
          const floatY=Math.sin(t*3)*3;
          ctx.save();ctx.globalAlpha=alpha;
          ctx.translate(princessX,359+floatY-16*slide);
          ctx.scale(shrink,shrink);
          drawSpriteOnFeet(processedAssets.princess,0,0,49);
          ctx.restore();
          ctx.save();ctx.globalAlpha=alpha;
          ctx.translate(villainX,367+floatY-13*slide);
          ctx.scale(shrink,shrink);
          if(extras.villain)drawObject(extras.villain,-38,-100,76,100);
          else{ctx.fillStyle='#211136';ctx.fillRect(-25,-90,50,87);}
          ctx.restore();
        }
        function drawForestStoryText(){
          const intro=state==='forestIntro';const t=forestSceneSeconds;
          const dialogue=intro?[
            {from:0,to:2.5,speaker:'VITORIA',message:'GABRIEL! ELE ME TROUXE PRA ESTA FLORESTA!',color:'#ffadd1'},
            {from:2.5,to:4.3,speaker:'GABRIEL',message:'VOCÊ DE NOVO?!',color:'#ffe4a0'},
            {from:4.3,to:6.5,speaker:'GABRIEL',message:'QUEM É QUE TÁ TENTANDO ME TALARICAR?!',color:'#ffe4a0'},
            {from:6.5,to:8.5,speaker:'VILÃO',message:'SE QUER VITORIA, VENHA BUSCÁ-LA!',color:'#d6a5ff'},
            {from:8.5,to:10.6,speaker:'VITORIA',message:'GABRIEL! NÃO DESISTA DE MIM!',color:'#ffadd1'},
            {from:10.6,to:12.7,speaker:'GABRIEL',message:'EU VOU ATRÁS DE VOCÊS!',color:'#ffe4a0'}
          ]:[
            {from:0,to:2.5,speaker:'GABRIEL',message:'FINALMENTE! AGORA EU TE PEGUEI!',color:'#ffe4a0'},
            {from:2.5,to:4.7,speaker:'VITORIA',message:'GABRIEL! ELE VAI FUGIR DE NOVO!',color:'#ffadd1'},
            {from:4.7,to:6.9,speaker:'VILÃO',message:'VOCÊ AINDA ESTÁ MUITO LONGE DA VERDADE!',color:'#d6a5ff'},
            {from:6.9,to:8.9,speaker:'GABRIEL',message:'PARE DE TENTAR ME TALARICAR!',color:'#ffe4a0'},
            {from:8.9,to:11.3,speaker:'GABRIEL',message:'DA PRÓXIMA VEZ VOCÊ NÃO ESCAPA!',color:'#ffe4a0'}
          ];
          const line=storyLine(t,dialogue);
          if(line)drawStoryDialogue(line.speaker,line.message,line.color);
          pixelText('ENTER OU BOTÃO A: PULAR CENA',GAME_HEIGHT-17,7,'#cdd6e6');
        }
        function drawLevelTwo(){
          drawForestBackground();
          ctx.save();ctx.translate(-Math.round(cameraX),0);
          for(const b of level2Blocks){
            if(b.type==='forestGround')drawForestGround(b);
            else if(b.type==='wood')drawObject(extras.wood,b.x,b.y,b.w,b.h);
            else if(b.type==='magic')drawObject(extras.magic,b.x,b.y,b.w,b.h);
          }
          const flag=checkpointReached?extras.checkpointOn:extras.checkpointOff;
          if(flag)drawObject(flag,1755,312,42,68);
          else {ctx.fillStyle='#8e6db1';ctx.fillRect(1765,325,4,55);}
          if(state==='forestIntro'||state==='forestOutro')drawForestStoryActors();
          drawEnemies();drawHero();
          ctx.restore();
          if(state==='forestIntro'||state==='forestOutro')drawForestStoryText();
        }
        function overlay(title,detail,foot){
          ctx.fillStyle='rgba(8,4,22,.77)';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
          pixelText(title,176,20,'#f2eaff');
          pixelText(detail,215,11,'#c4a8f5');
          if(foot)pixelText(foot,260,9,'#e8e9fc');
        }
        function draw(){
          ctx.imageSmoothingEnabled=false;
          if(!sceneReady){ctx.fillStyle='#5c94fc';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);pixelText('CARREGANDO A MAGIA...',GAME_HEIGHT/2,12);return;}
          if(level===1)drawLevelOne();else drawLevelTwo();
          if(state==='title2')overlay('FASE 2','A FLORESTA MISTERIOSA','ENTER OU BOTÃO A PARA COMEÇAR');
          if(state==='gameover')overlay('GAME OVER','AS VIDAS ACABARAM','CLIQUE EM RECOMEÇAR');
          if(state==='chapterEnd')overlay('VITORIA FOI LEVADA DE NOVO!','O MISTÉRIO CONTINUA...','FASE 3 EM BREVE  |  RECOMEÇAR PARA JOGAR');
        }
        function loop(now){
          const dt=Math.min(.05,(now-previousFrame)/1000);
          previousFrame=now;update(dt,now);draw();requestAnimationFrame(loop);
        }
        setHUD();
        requestAnimationFrame(loop);
    </script>
</body>
