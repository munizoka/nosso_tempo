<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Força a tela cheia e impede zoom no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Super Gabriel Bros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #5c94fc; touch-action: none; font-family: 'Inter', sans-serif; }
        
        /* O Canvas do Jogo Pixelado */
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated; /* Deixa o jogo com ar retro */
        }

        /* Controles Touch Translucidos */
        .touch-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background 0.1s, transform 0.1s;
        }
        .touch-btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.90); }
    </style>
</head>
<body>

    <!-- Aviso para girar a tela (Aparece se o celular estiver em pé) -->
    <div id="orientation-warning" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center text-white md:hidden portrait:flex landscape:hidden">
        <span class="text-6xl mb-4 animate-bounce">📱🔄</span>
        <h2 class="text-xl font-bold text-center px-4">Vire o celular deitado para jogar!</h2>
    </div>

    <!-- Botão de Voltar -->
    <a href="index.html" class="absolute top-4 left-4 z-50 w-10 h-10 bg-black/40 border border-white/30 rounded-full flex items-center justify-center text-white font-bold backdrop-blur hover:bg-black/60 transition-all">←</a>

    <canvas id="game-canvas"></canvas>

    <!-- Controles Mobile (Joysticks) Ocultos no PC, visíveis no Mobile em modo Paisagem -->
    <div class="fixed inset-0 pointer-events-none z-40 flex justify-between items-end pb-6 px-6 landscape:flex portrait:hidden sm:flex">
        
        <!-- Direcional Esquerdo -->
        <div class="flex gap-2 pointer-events-auto items-end">
            <button id="btn-left" class="touch-btn w-16 h-16 text-2xl">◀</button>
            <button id="btn-down" class="touch-btn w-16 h-16 text-2xl">▼</button>
            <button id="btn-right" class="touch-btn w-16 h-16 text-2xl">▶</button>
        </div>

        <!-- Botão de Ação Direito (Pular) -->
        <div class="pointer-events-auto">
            <button id="btn-jump" class="touch-btn w-20 h-20 text-4xl shadow-[0_0_20px_rgba(244,63,94,0.4)] !bg-rose-500/50 !border-rose-400">A</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // Resolução interna do jogo (Estilo GBA/SNES)
        const GAME_WIDTH = 600;
        const GAME_HEIGHT = 350;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // ESTADOS DO TECLADO/TOUCH
        const keys = { left: false, right: false, up: false, down: false };

        // O HERÓI (GABRIEL)
        const player = {
            x: 50, y: 200, w: 24, h: 32,
            vx: 0, vy: 0,
            speed: 3.5, jumpPower: -10, gravity: 0.5,
            grounded: false, isCrouching: false,
            color: '#3b82f6' // Azul
        };

        // A PRINCESA (VITÓRIA) E O FIM DA FASE
        const princess = {
            x: 2800, y: 288, w: 24, h: 32,
            color: '#ec4899' // Rosa
        };
        const castle = { x: 2850, y: 200, w: 100, h: 120, color: '#94a3b8' };

        // INIMIGOS
        let enemies = [
            { x: 400, y: 288, w: 24, h: 24, vx: -1, type: 'goomba', alive: true, color: '#b45309' },
            { x: 900, y: 288, w: 24, h: 24, vx: -1, type: 'goomba', alive: true, color: '#b45309' },
            { x: 1400, y: 288, w: 24, h: 24, vx: -1.2, type: 'koopa', alive: true, color: '#15803d' },
            { x: 1450, y: 288, w: 24, h: 24, vx: -1.2, type: 'koopa', alive: true, color: '#15803d' }
        ];

        let cameraX = 0;
        let gameWin = false;

        // O CENÁRIO (Réplica minimalista do Mario 1-1)
        const blocks = [
            // CHÃO PRINCIPAL (Com os famosos 2 buracos)
            { x: 0, y: 320, w: 1100, h: 100, type: 'ground', color: '#854d21' },
            { x: 1180, y: 320, w: 300, h: 100, type: 'ground', color: '#854d21' },
            { x: 1550, y: 320, w: 1500, h: 100, type: 'ground', color: '#854d21' },

            // CANOS VERDES
            { x: 450, y: 270, w: 40, h: 50, type: 'pipe', color: '#22c55e' },
            { x: 600, y: 240, w: 40, h: 80, type: 'pipe', color: '#22c55e' },
            { x: 750, y: 210, w: 40, h: 110, type: 'pipe', color: '#22c55e' },
            { x: 950, y: 210, w: 40, h: 110, type: 'pipe', color: '#22c55e' },

            // BLOCOS MISTERIOSOS E TIJOLOS (Y: 210 = Baixos, Y: 100 = Altos)
            { x: 250, y: 210, w: 24, h: 24, type: 'surprise', color: '#eab308' },
            
            { x: 350, y: 210, w: 24, h: 24, type: 'brick', color: '#b45309' },
            { x: 374, y: 210, w: 24, h: 24, type: 'surprise', color: '#eab308' },
            { x: 398, y: 210, w: 24, h: 24, type: 'brick', color: '#b45309' },
            { x: 422, y: 210, w: 24, h: 24, type: 'surprise', color: '#eab308' },
            { x: 446, y: 210, w: 24, h: 24, type: 'brick', color: '#b45309' },
            { x: 398, y: 100, w: 24, h: 24, type: 'surprise', color: '#eab308' }, // Aquele bloco alto solitário

            // A ESCADINHA CLÁSSICA ANTES DA BANDEIRA
            { x: 2400, y: 296, w: 24, h: 24, type: 'block', color: '#f87171' },
            { x: 2424, y: 272, w: 24, h: 48, type: 'block', color: '#f87171' },
            { x: 2448, y: 248, w: 24, h: 72, type: 'block', color: '#f87171' },
            { x: 2472, y: 224, w: 24, h: 96, type: 'block', color: '#f87171' },
        ];

        // Mapeamento de Teclado
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
        });

        // Mapeamento de Touch
        function bindTouch(id, keyStr) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyStr] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyStr] = false; });
        }
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-down', 'down');
        bindTouch('btn-jump', 'up');

        // Função de Colisão Básica
        function isColliding(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function reiniciarFase() {
            player.x = 50; 
            player.y = 100;
            player.vx = 0; 
            player.vy = 0;
            cameraX = 0;
            // Revive inimigos
            enemies.forEach(e => { e.alive = true; });
        }

        // MOTOR FÍSICO
        function update() {
            if(gameWin) return;

            // Movimento Horizontal
            if (keys.left && !keys.down) player.vx = -player.speed;
            else if (keys.right && !keys.down) player.vx = player.speed;
            else player.vx = 0;

            // Agachar
            if (keys.down && player.grounded) {
                player.isCrouching = true;
                player.h = 16; 
                player.y += 16; // Compensa a altura para não flutuar
            } else if (player.isCrouching) {
                player.isCrouching = false;
                player.y -= 16; // Volta a altura normal
                player.h = 32;
            }

            // Pulo
            if (keys.up && player.grounded && !keys.down) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            // Aplicar Gravidade
            player.vy += player.gravity;

            // === RESOLUÇÃO DE COLISÕES (O SEGREDO DO MOTOR PLATAFORMA) ===
            player.grounded = false;

            // Mover em X
            player.x += player.vx;
            // Limite da tela esquerda
            if (player.x < cameraX) player.x = cameraX; 

            for (let b of blocks) {
                if (isColliding(player, b)) {
                    if (player.vx > 0) player.x = b.x - player.w; // Bateu na esquerda do bloco
                    else if (player.vx < 0) player.x = b.x + b.w; // Bateu na direita do bloco
                    player.vx = 0;
                }
            }

            // Mover em Y
            player.y += player.vy;
            for (let b of blocks) {
                if (isColliding(player, b)) {
                    if (player.vy > 0) { // Caindo em cima do bloco
                        player.y = b.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) { // Bateu a cabeça por baixo
                        player.y = b.y + b.h;
                        player.vy = 0;
                        // Aqui no futuro tocaremos o som da moedinha!
                    }
                }
            }

            // Buraco da morte
            if (player.y > GAME_HEIGHT + 100) {
                reiniciarFase();
            }

            // Lógica dos Inimigos
            for (let enemy of enemies) {
                if (!enemy.alive) continue;
                
                // Inimigo cai
                enemy.y += 3; 
                for (let b of blocks) {
                    if (isColliding(enemy, b)) {
                        enemy.y = b.y - enemy.h;
                        break;
                    }
                }

                // Inimigo anda
                enemy.x += enemy.vx;
                // Bateu no tubo? Muda de lado
                for (let b of blocks) {
                    if (b.type !== 'ground' && isColliding(enemy, b)) {
                        if (enemy.vx < 0) { enemy.x = b.x + b.w; enemy.vx *= -1; }
                        else { enemy.x = b.x - enemy.w; enemy.vx *= -1; }
                    }
                }

                // Colisão do Herói com Inimigo
                if (isColliding(player, enemy)) {
                    if (player.vy > 0 && player.y + player.h < enemy.y + 15) {
                        // PISOU EM CIMA (Mata Inimigo)
                        enemy.alive = false;
                        player.vy = player.jumpPower * 0.7; // Pulinho extra
                    } else {
                        // BATEU DE LADO (Morreu)
                        reiniciarFase();
                    }
                }
            }

            // Encostou na Princesa (Vitória!)
            if (isColliding(player, princess)) {
                gameWin = true;
            }

            // Câmera persegue o herói (avança apenas para a direita)
            if (player.x > cameraX + GAME_WIDTH / 2.5) {
                cameraX = player.x - GAME_WIDTH / 2.5;
            }
        }

        // DESENHAR NA TELA
        function draw() {
            // Fundo
            ctx.fillStyle = '#5c94fc'; // Céu
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.save();
            ctx.translate(-cameraX, 0); 

            // Cenário (Enquanto não temos as texturas)
            for (let b of blocks) {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                
                // Detalhe extra para parecer matinho no chão
                if(b.type === 'ground') {
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(b.x, b.y, b.w, 8);
                }
                // Desenhar '?' no bloco surpresa
                if(b.type === 'surprise') {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px Inter';
                    ctx.textAlign = 'center';
                    ctx.fillText('?', b.x + 12, b.y + 18);
                }
            }

            // Castelo e Princesa
            ctx.fillStyle = castle.color;
            ctx.fillRect(castle.x, castle.y, castle.w, castle.h);
            ctx.fillStyle = princess.color;
            ctx.fillRect(princess.x, princess.y, princess.w, princess.h);
            
            // Inimigos
            for (let enemy of enemies) {
                if(enemy.alive) {
                    ctx.fillStyle = enemy.color;
                    ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                }
            }

            // Jogador (Gabriel)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Tela de Vitória
            if(gameWin) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(cameraX, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 30px Inter';
                ctx.textAlign = 'center';
                ctx.fillText("VOCÊ RESGATOU A PRINCESA! ❤️", cameraX + GAME_WIDTH/2, GAME_HEIGHT/2 - 20);
                
                ctx.font = '14px Inter';
                ctx.fillStyle = '#f43f5e';
                ctx.fillText("Parabéns, meu herói!", cameraX + GAME_WIDTH/2, GAME_HEIGHT/2 + 20);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
