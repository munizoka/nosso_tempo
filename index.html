<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Tempo Juntos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* Fundo quase preto, bem elegante (Zinc 950) */
            color: #fafafa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Animação suave para abrir e fechar o accordion */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        
        .accordion-content.open {
            grid-template-rows: 1fr;
        }

        .accordion-inner {
            min-height: 0; /* Necessário para a transição de grid funcionar */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            transition-delay: 0s;
        }

        .accordion-content.open .accordion-inner {
            opacity: 1;
            transition-delay: 0.2s; /* Atrasa o surgimento do texto até abrir um pouco */
        }

        /* Rotação da setinha */
        .chevron {
            transition: transform 0.3s ease;
        }
        .open-chevron {
            transform: rotate(180deg);
        }

        /* Bloco de tempo (Sub-blocos) */
        .time-block {
            background-color: #27272a; /* Cinza chumbo (Zinc 800) */
            border: 1px solid #3f3f46; /* Borda sutil (Zinc 700) */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .number-display {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <main class="w-full max-w-3xl w-full flex flex-col gap-6">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-light tracking-wider text-zinc-200">Nossa Linha do Tempo</h1>
            <div class="h-1 w-12 bg-zinc-700 mx-auto mt-4 rounded-full"></div>
        </div>

        <!-- ================= BLOCO 1 ================= -->
        <div class="rounded-2xl border border-zinc-800 bg-zinc-900 overflow-hidden shadow-2xl">
            <!-- Cabeçalho clicável -->
            <button onclick="toggleAccordion('acc1', 'icon1')" class="w-full flex justify-between items-center p-5 sm:p-6 cursor-pointer hover:bg-zinc-800/70 transition-colors focus:outline-none">
                <div class="text-left">
                    <h2 class="text-lg sm:text-xl md:text-2xl font-medium tracking-wide text-zinc-100">Tempo beijando sua boca</h2>
                    <p class="text-zinc-500 text-xs sm:text-sm mt-1 font-light">Desde 21 de Agosto de 2023</p>
                </div>
                <!-- Ícone da seta -->
                <svg id="icon1" class="chevron w-6 h-6 text-zinc-500 flex-shrink-0 ml-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
            
            <!-- Conteúdo Oculto (Contadores) -->
            <div id="acc1" class="accordion-content">
                <div class="accordion-inner">
                    <div class="p-5 sm:p-6 pt-0 sm:pt-0">
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-3 sm:gap-4 mt-2">
                            <!-- Blocos individuais -->
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="kiss-years" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Anos</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="kiss-months" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Meses</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="kiss-days" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Dias</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="kiss-hours" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Horas</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="kiss-minutes" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Min</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="kiss-seconds" class="number-display text-2xl sm:text-3xl font-semibold mb-1 text-zinc-300">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-500">Seg</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= BLOCO 2 ================= -->
        <div class="rounded-2xl border border-zinc-800 bg-zinc-900 overflow-hidden shadow-2xl">
            <!-- Cabeçalho clicável -->
            <button onclick="toggleAccordion('acc2', 'icon2')" class="w-full flex justify-between items-center p-5 sm:p-6 cursor-pointer hover:bg-zinc-800/70 transition-colors focus:outline-none">
                <div class="text-left">
                    <h2 class="text-lg sm:text-xl md:text-2xl font-medium tracking-wide text-zinc-100">Tempo de namoro</h2>
                    <p class="text-zinc-500 text-xs sm:text-sm mt-1 font-light">Desde 07 de Maio de 2024</p>
                </div>
                <!-- Ícone da seta -->
                <svg id="icon2" class="chevron w-6 h-6 text-zinc-500 flex-shrink-0 ml-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
            
            <!-- Conteúdo Oculto (Contadores) -->
            <div id="acc2" class="accordion-content">
                <div class="accordion-inner">
                    <div class="p-5 sm:p-6 pt-0 sm:pt-0">
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-3 sm:gap-4 mt-2">
                            <!-- Blocos individuais -->
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="love-years" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Anos</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="love-months" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Meses</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="love-days" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Dias</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="love-hours" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Horas</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="love-minutes" class="number-display text-2xl sm:text-3xl font-semibold mb-1">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-400">Min</span>
                            </div>
                            <div class="time-block rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center">
                                <span id="love-seconds" class="number-display text-2xl sm:text-3xl font-semibold mb-1 text-zinc-300">00</span>
                                <span class="text-[9px] sm:text-[10px] font-medium uppercase tracking-widest text-zinc-500">Seg</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // ================= INTERATIVIDADE DOS BLOCOS (ACCORDION) =================
        function toggleAccordion(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            
            // Alterna a classe 'open' que controla a altura
            content.classList.toggle('open');
            // Alterna a rotação do ícone
            icon.classList.toggle('open-chevron');
        }

        // Abre o primeiro bloco por padrão ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            toggleAccordion('acc1', 'icon1');
        });

        // ================= LÓGICA DE CÁLCULO DE DATAS =================
        const kissDate = new Date('2023-08-21T00:00:00');
        const loveDate = new Date('2024-05-07T00:00:00');

        function calculateTimePassed(startDate) {
            const now = new Date();

            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            let hours = now.getHours() - startDate.getHours();
            let minutes = now.getMinutes() - startDate.getMinutes();
            let seconds = now.getSeconds() - startDate.getSeconds();

            if (seconds < 0) { seconds += 60; minutes--; }
            if (minutes < 0) { minutes += 60; hours--; }
            if (hours < 0) { hours += 24; days--; }
            if (days < 0) {
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
                months--;
            }
            if (months < 0) { months += 12; years--; }

            return { years, months, days, hours, minutes, seconds };
        }

        const pad = (num) => num.toString().padStart(2, '0');

        function updateAllCounters() {
            // Atualiza Kiss
            const kissTime = calculateTimePassed(kissDate);
            document.getElementById('kiss-years').innerText = pad(kissTime.years);
            document.getElementById('kiss-months').innerText = pad(kissTime.months);
            document.getElementById('kiss-days').innerText = pad(kissTime.days);
            document.getElementById('kiss-hours').innerText = pad(kissTime.hours);
            document.getElementById('kiss-minutes').innerText = pad(kissTime.minutes);
            document.getElementById('kiss-seconds').innerText = pad(kissTime.seconds);

            // Atualiza Namoro
            const loveTime = calculateTimePassed(loveDate);
            document.getElementById('love-years').innerText = pad(loveTime.years);
            document.getElementById('love-months').innerText = pad(loveTime.months);
            document.getElementById('love-days').innerText = pad(loveTime.days);
            document.getElementById('love-hours').innerText = pad(loveTime.hours);
            document.getElementById('love-minutes').innerText = pad(loveTime.minutes);
            document.getElementById('love-seconds').innerText = pad(loveTime.seconds);
        }

        // Inicia e mantém rodando a cada 1 segundo
        updateAllCounters();
        setInterval(updateAllCounters, 1000);
    </script>
</body>
</html>
